<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعانتي — مدير إعانة الطالب</title>
<meta name="description" content="إعانتي: تطبيق مجاني لطلبة الجامعة لإدارة الإعانة والمصروفات والادخار بالدينار الكويتي. بياناتك تبقى في جهازك.">
<meta name="theme-color" content="#0b7a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إعانتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6f4;--card:#ffffff;--card2:#f7faf8;--text:#10201a;--muted:#5f716a;--line:#e1e9e5;
  --pri:#0b7a5c;--pri2:#13a07a;--pri-soft:#e2f3ec;--on-pri:#fff;
  --gold:#c98a12;--gold-soft:#fbf0d8;
  --red:#d64545;--red-soft:#fde9e9;--yel:#b77d00;--yel-soft:#fff3d1;--grn:#168a52;--grn-soft:#dff4e8;
  --shadow:0 1px 2px rgba(16,32,26,.05),0 10px 28px rgba(16,32,26,.07);
  --r:22px;--free:#d5dfdb;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#0a110f;--card:#121c19;--card2:#17231f;--text:#e7f0ec;--muted:#93a69e;--line:#22312c;
  --pri:#2cc394;--pri2:#2cc394;--pri-soft:#12322a;--on-pri:#06231a;
  --gold:#f0b84a;--gold-soft:#2e2513;
  --red:#ff7070;--red-soft:#3a1818;--yel:#ffcb52;--yel-soft:#33290f;--grn:#45d891;--grn-soft:#11301f;
  --shadow:0 0 0 1px rgba(255,255,255,.03);--free:#2b3a35;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",Tajawal,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:15px;min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:620px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* header */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;line-height:1.3}
.top h1 small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
.icon-btn:active{transform:scale(.94)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* hero */
.hero{background:linear-gradient(140deg,#0b7a5c,#0f9a73 55%,#1fb488);color:#fff;border-radius:26px;padding:18px 18px 16px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(11,122,92,.28)}
[data-theme="dark"] .hero{background:linear-gradient(140deg,#0b5a45,#0e7a5c 55%,#14966f);box-shadow:none}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.95}
.pill{background:rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.hero-num{font-size:44px;font-weight:700;margin:4px 0 0;line-height:1.15}
.hero-num small{font-size:18px;font-weight:600;opacity:.9}
.hero-sub{font-size:14px;opacity:.95;margin-bottom:12px}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero-row div{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 10px}
.hero-row b{display:block;font-size:15px}
.hero-row span{font-size:11.5px;opacity:.9}
.cycle-bar{height:6px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:12px;overflow:hidden;position:relative;z-index:1}
.cycle-bar i{display:block;height:100%;background:#fff;border-radius:9px}
.cycle-cap{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-top:5px;position:relative;z-index:1}

/* alert */
.alert{border-radius:16px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.alert.green{background:var(--grn-soft);color:var(--grn);border-color:color-mix(in srgb,var(--grn) 25%,transparent)}
.alert.yellow{background:var(--yel-soft);color:var(--yel);border-color:color-mix(in srgb,var(--yel) 30%,transparent)}
.alert.red{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.alert.info{background:var(--gold-soft);color:var(--gold)}
.alert .grow small{display:block;font-weight:500;opacity:.9;font-size:12.5px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px}
.stat .lbl{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .val{font-size:20px;font-weight:700;margin-top:2px}
.stat .val small{font-size:12px;font-weight:600;color:var(--muted)}
.stat .sub{font-size:11.5px;color:var(--muted)}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.stat.wide .val{font-size:26px}
.neg{color:var(--red)!important}
.pos{color:var(--grn)}

/* quick add */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.3;transition:transform .12s}
.qbtn .em{font-size:26px;line-height:1}
.qbtn:active{transform:scale(.95)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--pri);color:var(--on-pri);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.link{color:var(--pri);font-weight:600;font-size:13.5px}

/* donut */
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{width:180px;height:180px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle.seg{transition:stroke-width .2s,opacity .2s;cursor:pointer}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;pointer-events:none}
.donut .center b{font-size:20px;line-height:1.2}
.donut .center span{font-size:12px;color:var(--muted);line-height:1.3}
.legend{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.legend button{display:flex;align-items:center;gap:8px;font-size:13px;text-align:start;padding:4px 6px;border-radius:10px}
.legend button.on{background:var(--card2)}
.legend i{width:10px;height:10px;border-radius:4px;flex:none}
.legend .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.donut-wrap{flex-direction:column}.legend{width:100%}.donut{width:200px;height:200px}}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.item .t{font-weight:600;font-size:14.5px;line-height:1.35}
.item .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.item.off{opacity:.5}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:transparent;flex:none;transition:all .15s}
.check.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.del{color:var(--muted);font-size:17px;padding:6px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.empty .em{font-size:36px;display:block;margin-bottom:6px}
.day-h{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 2px;display:flex;justify-content:space-between}

/* switch */
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:right .2s}
.sw.on{background:var(--pri)}
.sw.on::after{right:21px}

/* progress */
.prog{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri2),var(--pri))}
.prog.gold i{background:linear-gradient(90deg,#f2c14e,var(--gold))}

/* chips / segmented */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.seg-c{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg-c button{flex:1;padding:8px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg-c button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.bar-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar-row .prog{height:8px}
.bar-row{width:100%;text-align:start}

/* vault */
.vault{background:linear-gradient(140deg,#b9780b,#d99a1e 60%,#ecb53f);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 12px 26px rgba(201,138,18,.28)}
[data-theme="dark"] .vault{background:linear-gradient(140deg,#7c5108,#a8740f 60%,#c58c1f);box-shadow:none}
.vault .big{font-size:36px;font-weight:700;line-height:1.2}
.vault .btns .btn{background:rgba(255,255,255,.2);color:#fff}
.goal{padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;background:var(--card2)}
.goal .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.goal .em{font-size:28px}
.goal .pct{font-weight:700;color:var(--pri);font-size:18px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));z-index:20}
.tabbar nav{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
.tab .em{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--pri)}
.tab.on .em{filter:none;opacity:1}
.fab{position:fixed;left:max(16px,calc(50% - 294px));bottom:calc(80px + var(--safe-b));width:58px;height:58px;border-radius:20px;background:var(--pri);color:var(--on-pri);font-size:30px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(11,122,92,.35);z-index:19}
.fab:active{transform:scale(.93)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(30px);transition:transform .25s}
.overlay.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h3 .sp{flex:1}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:86vh}}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:16px;outline:none;transition:border .15s}
.inp:focus{border-color:var(--pri)}
.inp.big{font-size:30px;font-weight:700;text-align:center;padding:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.cat-pick button{padding:9px 4px;border-radius:13px;border:1.5px solid var(--line);background:var(--card2);font-size:12px;font-weight:600;line-height:1.3}
.cat-pick button .em{font-size:20px;display:block}
.cat-pick button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:21px}
.emojis button.on{border-color:var(--pri);background:var(--pri-soft)}

/* onboarding */
.onb{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto}
.onb-in{max-width:520px;margin:0 auto;padding:calc(28px + var(--safe-t)) 20px calc(30px + var(--safe-b))}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(140deg,#0b7a5c,#1fb488);display:grid;place-items:center;font-size:36px;margin:0 auto 12px;box-shadow:0 12px 26px rgba(11,122,92,.3)}
.onb h1{text-align:center;margin:0;font-size:26px}
.onb .lead{text-align:center;color:var(--muted);margin:6px 0 20px}
.tier{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;transition:border .15s}
.tier.on{border-color:var(--pri);background:var(--pri-soft)}
.tier .em{font-size:28px}
.tier b{display:block;font-size:15.5px}
.tier span{font-size:12.5px;color:var(--muted)}
.tier .amt{font-size:17px;color:var(--pri)}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:24px;background:var(--pri)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;cursor:pointer}
.checkline input{width:20px;height:20px;accent-color:var(--pri);flex:none;margin-top:2px}

/* learn */
.lesson{border-inline-start:4px solid var(--pri);padding:2px 12px;margin:10px 0}
.quote{background:var(--pri-soft);color:var(--pri);border-radius:16px;padding:14px;font-weight:700;text-align:center;font-size:15.5px}
.nw{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.nw:last-child{border:0}
.nw .grow{line-height:1.35}
.nw .btn{padding:6px 10px;font-size:12.5px;border-radius:10px}
.tag{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.need{background:var(--grn-soft);color:var(--grn)}
.tag.want{background:var(--gold-soft);color:var(--gold)}
.rules{margin:0;padding:0 18px 0 0}
.rules li{margin-bottom:8px}
.rules li small{display:block;color:var(--muted)}
.calc-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.calc-out div{background:var(--card2);border-radius:14px;padding:10px 4px;border:1px solid var(--line)}
.calc-out b{display:block;font-size:17px}
.calc-out span{font-size:12px;color:var(--muted)}

.tpl{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:var(--card2)}
.tpl .head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.tpl .head .em{font-size:26px}
.tpl .stack{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:10px 0 6px}
.tpl .keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.tpl .keys i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px}
.tpl details{margin-top:8px;font-size:13px}
.tpl summary{cursor:pointer;color:var(--pri);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);background:#13221d;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
[data-theme="dark"] .toast{background:#e7f0ec;color:#10201a}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:20px 0 6px;line-height:1.8}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.install-steps{margin:0;padding:0 20px 0 0}
.install-steps li{margin-bottom:10px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:13px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabbar"><nav id="tabs"></nav></div>
<button class="fab" id="fab" data-a="addExp" aria-label="إضافة مصروف">+</button>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="onb"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============ ثوابت ============ */
const KEY = 'e3anati.v1';
const CATS = [
  {id:'coffee', icon:'☕', name:'قهوة وكافيهات الجامعة', short:'قهوة',     color:'#9a6239'},
  {id:'food',   icon:'🍔', name:'مطاعم وكافتيريا',        short:'مطاعم',    color:'#e8663d'},
  {id:'study',  icon:'📚', name:'كتب وطباعة وقرطاسية',    short:'دراسة',    color:'#3b7dd8'},
  {id:'fun',    icon:'⚽', name:'طلعات وديوانية وأنشطة',  short:'طلعات',    color:'#14a394'},
  {id:'car',    icon:'🚗', name:'صيانة ومواقف',           short:'سيارة',    color:'#667788'},

const $ = s => document.querySelector(s);

const r3 = x => Math.round((+x || 0) * 1000) / 1000;
const sum = a => r3(a.reduce((s, x) => s + (+x || 0), 0));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(v){
  if (v == null) return 0;
  const s = String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.').replace(/[^\d.\-]/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? r3(n) : 0;
}
function fmt(x){
  const v = r3(x);
  const s = Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:3});
  return (v < 0 ? '-' : '') + s;
}
const KD = x => `<span class="num">${fmt(x)}</span> د.ك`;
const KDt = x => `${fmt(x)} د.ك`;
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
const today = () => iso(new Date());
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
function addMonths(s, n){
  const d = parseISO(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return iso(d);
}
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
const LOC = 'ar-KW-u-nu-latn';
function fmtDate(s, opt){ try { return parseISO(s).toLocaleDateString(LOC, opt || {day:'numeric', month:'long'}); } catch(e){ return s; } }
function dayWord(n){ if (n === 1) return 'يوم واحد'; if (n === 2) return 'يومين'; if (n >= 3 && n <= 10) return n + ' أيام'; return n + ' يوم'; }
function monthWord(n){ if (n === 1) return 'شهر واحد'; if (n === 2) return 'شهرين'; if (n >= 3 && n <= 10) return n + ' أشهر'; return n + ' شهر'; }

function planItems(tpl, income){

  }
  return out;
}
function defaultState(){

function load(){

    if (!raw) return defaultState();
    return normalize(JSON.parse(raw));
  } catch(e){ return defaultState(); }
}
function normalize(s){
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const o = Object.assign({}, d, s);
  o.profile = Object.assign({}, d.profile, s.profile || {});
  o.cycle = Object.assign({}, d.cycle, s.cycle || {}); o.cycle.paid = o.cycle.paid || {};
  for (const k of ['commitments','cycles','expenses','vault','goals']) if (!Array.isArray(o[k])) o[k] = d[k];
  if (!o.nextPayday) o.nextPayday = d.nextPayday;
  return o;
}

/* ============ الحسابات ============ */
function bucketBal(goalId){ return sum(state.vault.filter(v => (v.goal || null) === (goalId || null)).map(v => v.amount)); }
function goalSaved(g){ return bucketBal(g.id); }
function calc(){
  const S = state, c = S.cycle.id, t = today();
  const allowance = parseNum(S.profile.allowance), extra = parseNum(S.profile.extra);
  const income = r3(allowance + extra);
  const act = S.commitments.filter(x => x.active);
  const commitTotal = sum(act.map(x => x.amount));
  const commitPaid = sum(act.filter(x => S.cycle.paid[x.id]).map(x => x.amount));
  const commitSave = sum(act.filter(x => x.type === 'save').map(x => x.amount));
  const commitNormal = r3(commitTotal - commitSave);
  const exps = S.expenses.filter(e => e.cycle === c);
  const expTotal = sum(exps.map(e => e.amount));
  const manualSave = sum(S.vault.filter(v => v.cycle === c && (v.src === 'manual' || v.src === 'withdraw')).map(v => v.amount));
  const free = r3(income - commitTotal - expTotal - manualSave);
  const todaySpent = sum(exps.filter(e => e.date === t).map(e => e.amount));
  const diff = daysBetween(t, S.nextPayday);
  const daysLeft = Math.max(1, diff);
  const startToday = r3(free + todaySpent);
  const safeDaily = r3(Math.max(0, startToday) / daysLeft);
  const leftToday = r3(safeDaily - todaySpent);
  const safeWeekly = r3(Math.max(0, startToday) * Math.min(7, daysLeft) / daysLeft);
  const spendable = r3(income - commitTotal - manualSave);
  const ratio = spendable > 0 ? expTotal / spendable : (expTotal > 0 ? 1 : 0);
  const totalSavings = sum(S.vault.map(v => v.amount));
  const unalloc = bucketBal(null);
  const cycleLen = Math.max(1, daysBetween(S.cycle.start, S.nextPayday));
  const elapsed = clamp(daysBetween(S.cycle.start, t) / cycleLen);
  const byCat = {}; CATS.forEach(cc => byCat[cc.id] = 0);
  exps.forEach(e => byCat[e.cat] = r3((byCat[e.cat] || 0) + e.amount));

  let status;
  if (free < 0) status = {cls:'red', icon:'🔴', msg:`تجاوزت ميزانيتك بـ ${KDt(-free)}`, sub:'وقّف الصرف غير الضروري لين تنزل الإعانة، أو اسحب من الحصالة للطوارئ فقط.'};
  else if (todaySpent > safeDaily + 0.0005 && todaySpent > 0) status = {cls:'red', icon:'🔴', msg:'تجاوزت الحد اليومي المقترح', sub:`صرفت اليوم ${KDt(todaySpent)} والمسموح ${KDt(safeDaily)} — خفّف بكرة عشان يتعدل الحساب.`};
  else if (ratio >= 0.75) status = {cls:'yellow', icon:'🟡', msg:`انتبه! وصلت ${Math.round(ratio*100)}% من ميزانية الصرف`, sub:`باقي لك ${KDt(Math.max(0,free))} لين ${fmtDate(S.nextPayday)}.`};
  else status = {cls:'green', icon:'🟢', msg:'وضعك ممتاز 👌', sub: expTotal > 0 ? `صارف ${Math.round(ratio*100)}% بس من ميزانية الصرف — كمّل على نفس الريتم.` : 'ما صرفت شي للحين هالدورة. سجّل أي مصروف أول بأول.'};

  return {allowance, extra, income, commitTotal, commitPaid, commitSave, commitNormal, exps, expTotal, manualSave, free,
    todaySpent, diff, daysLeft, safeDaily, leftToday, safeWeekly, spendable, ratio, totalSavings, unalloc, elapsed, byCat, status,
    savedThisCycle: r3(commitSave + manualSave)};
}

/* ---- الرسم الدائري ---- */
function donutData(k){
  const segs = [];
  if (k.commitNormal > 0) segs.push({id:'commit', label:'التزامات ثابتة', value:k.commitNormal, color:C_COMMIT});
  if (k.savedThisCycle > 0) segs.push({id:'save', label:'ادخار', value:k.savedThisCycle, color:C_SAVE});
  CATS.forEach(c => { if (k.byCat[c.id] > 0) segs.push({id:c.id, label:c.icon + ' ' + c.short, value:k.byCat[c.id], color:c.color}); });
  if (k.free > 0) segs.push({id:'free', label:'رصيد حر', value:k.free, color:'var(--free)'});
  return segs;
}
function donutCard(k){
  const segs = donutData(k);
  const total = sum(segs.map(s => s.value));
  if (!total) return `<div class="card"><h2>🍩 وين تروح إعانتك؟</h2><div class="empty"><span class="em">🍩</span>حدد دخلك والتزاماتك عشان يطلع الرسم.</div></div>`;
  const R = 70, C = 2 * Math.PI * R, gap = segs.length > 1 ? 1.5 : 0;
  let off = 0;
  const sel = segs.find(s => s.id === ui.donutSel);
  const circles = segs.map(s => {
    const len = s.value / total * C;
    const dash = Math.max(0.5, len - gap);
    const el = `<circle class="seg" data-a="donut" data-id="${s.id}" cx="90" cy="90" r="${R}" fill="none" stroke="${s.color}" stroke-width="${sel && sel.id === s.id ? 26 : 20}" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" opacity="${sel && sel.id !== s.id ? .35 : 1}"></circle>`;
    off += len; return el;
  }).join('');
  const center = sel
    ? `<b class="num">${fmt(sel.value)}</b><span>د.ك · ${Math.round(sel.value/total*100)}%</span><span>${sel.label}</span>`
    : (k.free < 0 ? `<b class="num neg">${fmt(k.free)}</b><span>د.ك — تجاوزت الدخل</span>` : `<b class="num">${fmt(k.income)}</b><span>د.ك إجمالي الدخل</span>`);
  return `<div class="card"><h2>🍩 وين تروح إعانتك بالضبط؟</h2><div class="donut-wrap">
    <div class="donut"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--card2)" stroke-width="20"></circle>${circles}</svg><div class="center">${center}</div></div>
    <div class="legend">${segs.map(s => `<button class="${sel && sel.id === s.id ? 'on' : ''}" data-a="donut" data-id="${s.id}"><i style="background:${s.color}"></i><span class="grow">${s.label}</span><b>${KD(s.value)}</b></button>`).join('')}</div>
  </div><div class="hint" style="text-align:center">اضغط على أي جزء عشان تشوف تفاصيله</div></div>`;
}

/* ============ المصروفات ============ */
function filteredExps(){
  const t = today(), mon = t.slice(0, 7);
  let list = state.expenses;
  if (ui.expPeriod === 'cycle') list = list.filter(e => e.cycle === state.cycle.id);
  else if (ui.expPeriod === 'month') list = list.filter(e => String(e.date).slice(0, 7) === mon);
  if (ui.expCat !== 'all') list = list.filter(e => e.cat === ui.expCat);
  return list.slice().sort((a, b) => (b.date + (b.ts||'')) > (a.date + (a.ts||'')) ? 1 : -1);
}
function expRow(e){
  const c = catOf(e.cat);
  return `<div class="item"><div class="ic" style="background:color-mix(in srgb,${c.color} 15%,transparent)">${c.icon}</div>
    <div class="grow"><div class="t">${esc(e.note) || c.name}</div><div class="s">${c.short} · ${fmtDate(e.date, {weekday:'short', day:'numeric', month:'short'})}</div></div>
    <div class="amt">${KD(e.amount)}</div><button class="del" data-a="delExp" data-id="${e.id}" aria-label="حذف">🗑️</button></div>`;
}
function viewExp(k){
  const periods = {cycle:'هالدورة', month:'هالشهر', all:'من البداية'};
  const list = filteredExps();
  const total = sum(list.map(e => e.amount));
  let h = `<div class="card"><h2>⚡ إضافة سريعة بلمسة</h2><div class="quick">${CATS.map(c => `<button class="qbtn" data-a="addExp" data-cat="${c.id}"><span class="em">${c.icon}</span>${c.name}</button>`).join('')}</div></div>`;
  h += `<div class="card"><h2>🔎 كم صرفت على…؟</h2>
    <div class="seg-c" style="margin-bottom:10px">${Object.entries(periods).map(([id, n]) => `<button class="${ui.expPeriod === id ? 'on' : ''}" data-a="expPeriod" data-id="${id}">${n}</button>`).join('')}</div>
    <div class="chips"><button class="chip ${ui.expCat === 'all' ? 'on' : ''}" data-a="expCat" data-id="all">الكل</button>${CATS.map(c => `<button class="chip ${ui.expCat === c.id ? 'on' : ''}" data-a="expCat" data-id="${c.id}">${c.icon} ${c.short}</button>`).join('')}</div>
    <div style="text-align:center;margin:14px 0 4px"><div class="small muted">${ui.expCat === 'all' ? 'صرفت' : 'صرفت على ' + catOf(ui.expCat).icon + ' ' + catOf(ui.expCat).short} ${periods[ui.expPeriod]}</div><div style="font-size:32px;font-weight:700">${KD(total)}</div><div class="small muted">${list.length} عملية${list.length ? ' · المتوسط ' + KDt(total / list.length) : ''}</div></div>`;
  if (ui.expCat === 'all' && total > 0){
    const by = {}; list.forEach(e => by[e.cat] = r3((by[e.cat] || 0) + e.amount));
    const max = Math.max(...Object.values(by));
    h += `<div class="bars">${CATS.filter(c => by[c.id]).sort((a, b) => by[b.id] - by[a.id]).map(c => `<button class="bar-row" data-a="expCat" data-id="${c.id}"><span>${c.icon} ${c.short}</span><div class="prog"><i style="width:${by[c.id]/max*100}%;background:${c.color}"></i></div><b>${KD(by[c.id])}</b></button>`).join('')}</div>`;
  }
  if (ui.expCat === 'coffee' && total > 0){
    h += `<div class="hint" style="text-align:center;margin-top:8px">☕ ${ui.expPeriod === 'all' ? 'جرّب حاسبة العادات في «تعلّم» وشوف تكلفتها السنوية.' : `لو استمر نفس المعدل كل شهر، القهوة تكلّفك تقريبًا ${KDt(total * 12)} بالسنة.`}</div>`;
  }
  h += `</div>`;
  h += `<div class="card"><h2>📜 السجل</h2>${list.length ? groupByDay(list) : `<div class="empty"><span class="em">🔍</span>ما فيه مصروفات بهالفلتر.</div>`}</div>`;
  return h;
}
function groupByDay(list){
  const g = {};
  list.forEach(e => (g[e.date] = g[e.date] || []).push(e));
  return Object.keys(g).sort().reverse().map(d => `<div class="day-h"><span>${d === today() ? 'اليوم' : d === addDays(today(), -1) ? 'أمس' : fmtDate(d, {weekday:'long', day:'numeric', month:'long'})}</span><span>${KD(sum(g[d].map(e => e.amount)))}</span></div><div class="list">${g[d].map(expRow).join('')}</div>`).join('');
}

function viewGoals(k){

  let h = `<section class="vault"><div class="row"><div class="grow"><div style="opacity:.92;font-size:14px">🐷 حصالة الادخار التراكمية</div><div class="big"><span class="num">${fmt(k.totalSavings)}</span> <small style="font-size:16px">د.ك</small></div>

    <div class="btns" style="margin-top:12px"><button class="btn sm" data-a="vaultOp" data-op="manual">➕ إيداع</button><button class="btn sm" data-a="vaultOp" data-op="withdraw">🛟 سحب طوارئ</button><button class="btn sm" data-a="vaultOp" data-op="move">🔁 نقل لهدف</button></div></section>`;
  h += `<div class="card"><h2>🎯 أهدافك<span class="sp"></span><button class="link" data-a="editGoal">+ هدف جديد</button></h2>`;

    h += `<div class="empty"><span class="em">🎯</span>حط لك هدف وخلّ الادخار له معنى!</div><div class="chips" style="justify-content:center;flex-wrap:wrap">${GOAL_PRESETS.map((p, i) => `<button class="chip" data-a="editGoal" data-preset="${i}">${p.emoji} ${p.name}</button>`).join('')}</div>`;
  } else {
    h += S.goals.map(g => {
      const saved = goalSaved(g), target = parseNum(g.target), rem = r3(Math.max(0, target - saved));
      const pct = target ? clamp(saved / target) * 100 : 0;
      const monthly = parseNum(g.monthly);
      let eta;
      if (rem <= 0) eta = '🎉 وصلت لهدفك! مبروك';
      else if (monthly > 0){ const m = Math.ceil(rem / monthly - 1e-9); eta = `بمعدل ${KDt(monthly)} شهريًا توصل بعد ${monthWord(m)} تقريبًا (${fmtDate(addMonths(today(), m), {month:'long', year:'numeric'})})`; }
      else eta = 'حدد مبلغ شهري عشان نحسب لك متى توصل';
      return `<div class="goal"><div class="head"><span class="em">${g.emoji || '🎯'}</span><div class="grow"><b>${esc(g.name)}</b><div class="small muted">${KD(saved)} من ${KD(target)}</div></div><span class="pct num">${Math.floor(pct)}%</span></div>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="small muted" style="margin:8px 0 10px">${eta}${rem > 0 ? ` · باقي ${KD(rem)}` : ''}</div>
        <div class="btns"><button class="btn sm soft" data-a="vaultOp" data-op="manual" data-goal="${g.id}">➕ أضف له</button><button class="btn sm ghost" data-a="vaultOp" data-op="move" data-goal="${g.id}">🔁 من الحصالة</button><button class="btn sm ghost" data-a="editGoal" data-id="${g.id}">✏️</button></div></div>`;
    }).join('');
  }
  h += `</div>`;
  h += goalCalcCard();
  const hist = S.vault.slice().sort((a, b) => (b.date + (b.ts||'')) > (a.date + (a.ts||'')) ? 1 : -1).slice(0, 12);
  const srcName = {auto:'ادخار تلقائي', manual:'إيداع', withdraw:'سحب طوارئ', move:'نقل', carry:'ترحيل باقي الشهر'};
  h += `<div class="card"><h2>🧾 حركة الحصالة</h2>${hist.length ? `<div class="list">${hist.map(v => {
    const g = v.goal ? S.goals.find(x => x.id === v.goal) : null;
    return `<div class="item"><div class="ic">${v.amount >= 0 ? '⬆️' : '⬇️'}</div><div class="grow"><div class="t">${esc(v.note) || srcName[v.src] || 'حركة'}</div><div class="s">${g ? g.emoji + ' ' + esc(g.name) : '🐷 الحصالة'} · ${fmtDate(v.date)}</div></div><div class="amt ${v.amount < 0 ? 'neg' : 'pos'}">${v.amount > 0 ? '+' : ''}${KD(v.amount)}</div></div>`;
  }).join('')}</div>` : `<div class="empty">ما فيه حركات للحين. أشّر «ادخار تلقائي» في الالتزامات أو سوّ إيداع.</div>`}</div>`;
  return h;
}
function goalCalcCard(){
  return `<div class="card"><h2>🧮 حاسبة تقسيم الهدف</h2>
    <div class="small muted" style="margin:-6px 0 10px">حدد هدفك ← حدد المبلغ ← حدد المدة ← نحسب لك كم تدخر شهريًا.</div>
    <div class="two"><div class="field"><label>سعر الهدف (د.ك)</label><input class="inp" id="gcT" inputmode="decimal" value="300" data-in="gcalc"></div>
    <div class="field"><label>بعد كم شهر؟</label><input class="inp" id="gcM" inputmode="numeric" value="10" data-in="gcalc"></div></div>
    <div class="quote" id="gcOut">${gcText(300, 10)}</div></div>`;
}
function gcText(t, m){
  if (!(t > 0) || !(m > 0)) return 'دخّل المبلغ والمدة';
  const per = r3(t / m), k = calc();
  const pctInc = k.income ? Math.round(per / k.income * 100) : 0;
  return `تحتاج تدخر ${KD(per)} شهريًا<div class="small" style="font-weight:500;margin-top:4px">${fmt(t)} ÷ ${m} = ${fmt(per)} — يعني تقريبًا ${pctInc}% من دخلك الشهري</div>`;
}

function rule503020(){
  const inc = calc().income;
  const parts = [['الاحتياجات', 50, C_COMMIT], ['الرغبات والترفيه', 30, '#14a394'], ['الادخار', 20, C_SAVE]];

}
function habitOut(a, d){ const m = r3(a * d), y = r3(m * 12); return `<div><b>${KD(a)}</b><span>بالمرة</span></div><div><b>${KD(m)}</b><span>شهريًا</span></div><div><b class="neg">${KD(y)}</b><span>سنويًا!</span></div>`; }
function saveOut(a, m){ const t = r3(a * m); return `بعد ${monthWord(m)} يصير عندك ${KD(t)}<div class="small" style="font-weight:500;margin-top:4px">${fmt(a)} × ${m} = ${fmt(t)} — بدون أي أرباح، بس بالاستمرار</div>`; }

const C_ICONS = ['⛽','📶','💻','🤲','👕','🐷','🔧','🏠','📱','🎓','🍽️','🚌','💊','🎁','📦'];
let editIcon = '📌';
function sheetCommit(id){

}
function saveCommit(id){
  const name = $('#cmName').value.trim(), amt = parseNum($('#cmAmt').value);
  if (!name) { toast('اكتب اسم البند'); return; }
  if (amt < 0) { toast('المبلغ لازم يكون موجب'); return; }
  const type = $('#cmSave').checked ? 'save' : 'normal';
  const goal = $('#cmGoal') ? ($('#cmGoal').value || null) : null;
  if (id){
    const it = state.commitments.find(x => x.id === id);
    const wasPaid = !!state.cycle.paid[id];
    if (wasPaid && it.type === 'save'){
      // ألغِ القيد القديم وأعد إنشاءه بالقيم الجديدة
      if (!unpay(it)) return;
      Object.assign(it, {name, amount:amt, type, icon:editIcon, goal});
      pay(it);
    } else Object.assign(it, {name, amount:amt, type, icon:editIcon, goal});
  } else {
    state.commitments.push({id:uid(), icon:editIcon, name, amount:amt, type, goal, active:true});
  }
  closeSheet(); commit(); toast('انحفظ ✓');
}
function pay(it){
  state.cycle.paid[it.id] = true;
  if (it.type === 'save' && it.amount > 0)
    state.vault.push({id:uid(), amount:r3(it.amount), date:today(), ts:Date.now().toString(36), goal:it.goal || null, src:'auto', ref:it.id, cycle:state.cycle.id, note:'ادخار تلقائي — ' + it.name});
}
function unpay(it){
  const c = state.cycle.id;
  const entries = state.vault.filter(v => v.src === 'auto' && v.ref === it.id && v.cycle === c);
  for (const e of entries){
    if (bucketBal(e.goal) - e.amount < -0.0005){ toast('ما نقدر نلغي — المبلغ انسحب أو انتقل من الحصالة'); return false; }
  }
  state.vault = state.vault.filter(v => !entries.includes(v));
  delete state.cycle.paid[it.id];
  return true;
}

function sheetVault(op, goalId){
  const k = calc(), goals = state.goals;
  const opts = (sel) => `<option value="">🐷 الحصالة العامة (${KDt(bucketBal(null))})</option>${goals.map(g => `<option value="${g.id}" ${sel === g.id ? 'selected' : ''}>${g.emoji} ${esc(g.name)} (${KDt(goalSaved(g))})</option>`).join('')}`;
  const titles = {manual:'➕ إيداع في الحصالة', withdraw:'🛟 سحب للطوارئ', move:'🔁 نقل بين الحصالة والأهداف'};
  const notes = {
    manual:`المبلغ ينخصم من رصيدك الحر لهالدورة (المتاح: ${KD(Math.max(0, k.free))}).`,
    withdraw:'المبلغ يرجع لرصيدك الحر لهالدورة. خلّه للطوارئ الحقيقية بس 🙏',
    move:'نقل داخلي — ما يأثر على رصيدك الحر.'
  };
  if (op === 'move' && !goals.length){ toast('سوّ هدف أول عشان تنقل له'); sheetGoal(); return; }
  openSheet(`<h3>${titles[op]}<span class="sp"></span><button class="del" data-a="close">✕</button></h3>
    <p class="small muted" style="margin-top:0">${notes[op]}</p>
    <div class="field"><input class="inp big" id="vaAmt" inputmode="decimal" placeholder="0.000"></div>
    ${op === 'move'
      ? `<div class="field"><label>من</label><select class="inp" id="vaFrom">${opts(goalId ? '' : null)}</select></div><div class="field"><label>إلى</label><select class="inp" id="vaTo">${opts(goalId || (goals[0] && goals[0].id))}</select></div>`
      : `<div class="field"><label>${op === 'withdraw' ? 'من' : 'إلى'}</label><select class="inp" id="vaGoal">${opts(goalId || '')}</select></div>`}
    <div class="field"><label>ملاحظة (اختياري)</label><input class="inp" id="vaNote" maxlength="50"></div>
    <button class="btn ${op === 'withdraw' ? 'gold' : ''} block" data-a="doVault" data-op="${op}">تأكيد</button>`);
}
function doVault(op){
  const amt = parseNum($('#vaAmt').value);
  if (!(amt > 0)) { toast('دخّل مبلغ صحيح'); return; }
  const note = $('#vaNote').value.trim();
  const base = {date:today(), ts:Date.now().toString(36), cycle:state.cycle.id};
  if (op === 'move'){
    const from = $('#vaFrom').value || null, to = $('#vaTo').value || null;
    if (from === to) { toast('اختر وجهة مختلفة'); return; }
    if (bucketBal(from) + 0.0005 < amt) { toast(`الرصيد ما يكفي (${KDt(bucketBal(from))})`); return; }
    state.vault.push(Object.assign({id:uid(), amount:-amt, goal:from, src:'move', note:note || 'نقل'}, base));
    state.vault.push(Object.assign({id:uid(), amount:amt, goal:to, src:'move', note:note || 'نقل'}, base));
  } else if (op === 'withdraw'){
    const g = $('#vaGoal').value || null;
    if (bucketBal(g) + 0.0005 < amt) { toast(`الرصيد ما يكفي (${KDt(bucketBal(g))})`); return; }
    state.vault.push(Object.assign({id:uid(), amount:-amt, goal:g, src:'withdraw', note:note || 'سحب طوارئ'}, base));
  } else {
    const g = $('#vaGoal').value || null;
    const k = calc();
    state.vault.push(Object.assign({id:uid(), amount:amt, goal:g, src:'manual', note:note || 'إيداع'}, base));
    if (amt > k.free + 0.0005) setTimeout(() => toast('⚠️ الإيداع أكبر من رصيدك الحر — انتبه لمصروفك'), 2700);
  }
  closeSheet(); commit(); toast('تم ✓');
}

/* ---- الخطط الجاهزة ---- */
function tplStats(tpl, income){
  const items = planItems(tpl, income);
  const save = sum(items.filter(i => i.active && i.type === 'save').map(i => i.amount));
  const fixed = sum(items.filter(i => i.active && i.type !== 'save').map(i => i.amount));
  return {items, save, fixed, daily: r3(income - save - fixed)};
}
function sheetTemplates(){
  const inc = calc().income;
  openSheet(`<h3>🧭 خطط توزيع جاهزة<span class="sp"></span><button class="del" data-a="close">✕</button></h3>
    <p class="small muted" style="margin-top:0">محسوبة على دخلك (${KD(inc)}). التطبيق يعدّل مبالغ التزاماتك، والباقي يصير للصرف اليومي. تقدر تعدّل أي بند بعدين.</p>
    ${TEMPLATES.map(t => {
      const s = tplStats(t, inc);
      const pc = x => inc ? x / inc * 100 : 0;
      return `<div class="tpl"><div class="head"><span class="em">${t.icon}</span><div class="grow"><b>${t.name}</b></div></div>
        <div class="small muted">${t.desc}</div>
        <div class="stack"><i style="width:${pc(s.fixed)}%;background:${C_COMMIT}"></i><i style="width:${pc(s.daily)}%;background:#14a394"></i><i style="width:${pc(s.save)}%;background:${C_SAVE}"></i></div>
        <div class="keys"><span><i style="background:${C_COMMIT}"></i>التزامات ${KD(s.fixed)}</span><span><i style="background:#14a394"></i>صرف يومي ${KD(s.daily)}</span><span><i style="background:${C_SAVE}"></i>ادخار ${KD(s.save)}</span></div>
        <details><summary>تفاصيل البنود</summary>${s.items.filter(i => i.active).map(i => `<div class="row" style="padding:3px 0"><span class="grow">${i.icon} ${i.name}</span><b>${KD(i.amount)}</b></div>`).join('')}</details>
        <button class="btn sm block" style="margin-top:10px" data-a="applyTpl" data-id="${t.id}">طبّق هالخطة</button></div>`;
    }).join('')}`);
}
function applyTemplate(id){
  const tpl = TEMPLATES.find(t => t.id === id), inc = calc().income;
  const items = planItems(tpl, inc);
  let skipped = false;
  for (const ni of items){
    let it = state.commitments.find(x => x.id === ni.id);
    if (!it){ if (!ni.active) continue; it = Object.assign({}, ni); state.commitments.push(it); }
    if (state.cycle.paid[it.id] && it.type === 'save'){
      const e = state.vault.find(v => v.src === 'auto' && v.ref === it.id && v.cycle === state.cycle.id);
      const target = ni.active ? ni.amount : 0, delta = r3(target - (e ? e.amount : 0));
      if (e && delta < 0 && bucketBal(e.goal) + delta < -0.0005){ skipped = true; continue; }
      if (e){ e.amount = target; if (!target) state.vault = state.vault.filter(v => v !== e); }
      it.amount = ni.amount; it.active = ni.active; if (!it.active) delete state.cycle.paid[it.id];
    }
    else { it.amount = ni.amount; it.active = ni.active; if (!it.active) delete state.cycle.paid[it.id]; }
  }
  closeSheet(); commit(); toast(skipped ? 'تم التطبيق ✓ (ما غيّرنا الادخار التلقائي لأنك استخدمت مبلغه)' : `تم تطبيق «${tpl.name}» ✓`);
}

    <div class="btns"><button class="btn ghost sm" data-a="exportCSV" data-scope="cycle">📊 تقرير الشهر (Excel)</button><button class="btn ghost sm" data-a="exportCSV" data-scope="all">📊 كل المصروفات</button></div>
    <div class="hint">بياناتك محفوظة في هالمتصفح فقط. صدّر نسخة احتياطية بين فترة وفترة، خصوصًا قبل ما تمسح بيانات المتصفح أو تغيّر جهازك.</div>
    <div class="section-title">أخرى</div>
    <div class="btns" style="margin-bottom:8px"><button class="btn ghost sm" data-a="install">📲 طريقة التثبيت</button><button class="btn ghost sm" data-a="templates">🧭 الخطط الجاهزة</button></div>
    <div class="btns"><button class="btn ghost sm" data-a="reOnboard">🔁 الإعداد السريع</button><button class="btn danger sm" data-a="resetAll">🗑️ مسح كل البيانات</button></div>`);
}
function saveSettings(){
  const pd = $('#stPd').value;
  state.profile.name = $('#stName').value.trim();
  state.profile.allowance = parseNum($('#stAl').value);
  state.profile.extra = parseNum($('#stEx').value);
  if (pd) state.nextPayday = pd;
  closeSheet(); commit(); toast('انحفظ ✓');
}

/* ---- تصدير / استيراد ---- */
function download(name, content, type){
  try {
    const blob = new Blob([content], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('تم التصدير ✓');
  } catch(e){ toast('ما قدرنا نصدّر الملف من هالمتصفح'); }
}
function exportJSON(){ download(`e3anati-backup-${today()}.json`, JSON.stringify(state, null, 2), 'application/json'); }
function csvCell(v){ const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV(scope){
  const k = calc();
  const rows = [];
  const list = scope === 'all' ? state.expenses.slice() : k.exps.slice();
  list.sort((a, b) => a.date > b.date ? 1 : -1);
  if (scope === 'cycle'){
    rows.push(['تقرير إعانتي', `${state.cycle.start} إلى ${state.nextPayday}`]);
    rows.push([]);
    rows.push(['الملخص', 'المبلغ (د.ك)']);
    rows.push(['إجمالي الدخل', k.income], ['الالتزامات الثابتة', k.commitTotal], ['المصروفات', k.expTotal], ['ادخار هالدورة', k.savedThisCycle], ['الرصيد الحر', k.free], ['الادخار التراكمي', k.totalSavings]);
    rows.push([]);
    rows.push(['الالتزامات', 'المبلغ (د.ك)', 'الحالة']);
    state.commitments.filter(c => c.active).forEach(c => rows.push([c.name, c.amount, state.cycle.paid[c.id] ? 'مدفوع' : 'غير مدفوع']));
    rows.push([]);
    rows.push(['المصروفات حسب التصنيف', 'المبلغ (د.ك)']);
    CATS.forEach(c => rows.push([c.name, k.byCat[c.id] || 0]));
    rows.push([]);
  }
  rows.push(['التاريخ', 'التصنيف', 'المبلغ (د.ك)', 'ملاحظة']);
  list.forEach(e => rows.push([e.date, catOf(e.cat).name, e.amount, e.note || '']));
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  download(`e3anati-${scope === 'all' ? 'all-expenses' : 'report'}-${today()}.csv`, csv, 'text/csv;charset=utf-8');
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data || !Array.isArray(data.commitments) || !data.profile) throw new Error('bad');
      askConfirm('📂 استيراد نسخة', 'بنستبدل بياناتك الحالية بالنسخة المستوردة. متأكد؟', 'استورد', () => {
        state = normalize(data); state.onboarded = true; commit(); toast('تم الاستيراد ✓');
      });
    } catch(err){ toast('الملف مو نسخة صحيحة من إعانتي'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

/* ---- التثبيت ---- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
function isStandalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function sheetInstall(){
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /android/i.test(ua);
  openSheet(`<h3>📲 ثبّت «إعانتي» على شاشتك<span class="sp"></span><button class="del" data-a="close">✕</button></h3>
    ${isStandalone() ? '<div class="alert green">✅ التطبيق مثبّت عندك وشغّال كتطبيق.</div>' : ''}
    ${deferredPrompt ? '<button class="btn block" data-a="promptInstall" style="margin-bottom:14px">⬇️ ثبّت الحين بضغطة</button>' : ''}
    <div class="card" style="box-shadow:none;border:1px solid var(--line);${ios ? 'border-color:var(--pri)' : ''}"><h2>🍎 آيفون / آيباد (Safari)</h2><ol class="install-steps small">
      <li>افتح الموقع من متصفح <b>Safari</b>.</li><li>اضغط زر المشاركة <kbd>⬆️</kbd> تحت.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>«إضافة»</b> — وصار عندك تطبيق 🎉</li></ol></div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);${android ? 'border-color:var(--pri)' : ''}"><h2>🤖 أندرويد (Chrome)</h2><ol class="install-steps small">
      <li>افتح الموقع من <b>Chrome</b>.</li><li>اضغط القائمة <kbd>⋮</kbd> فوق.</li><li>اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</li></ol></div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line)"><h2>💻 الكمبيوتر (Chrome / Edge)</h2><p class="small muted" style="margin:0">اضغط أيقونة التثبيت <kbd>⊕</kbd> في شريط العنوان فوق.</p></div>`);
}

/* ============ الإعداد السريع ============ */
const ob = {tier:'basic', allowance:200, extra:0, name:'', payday:'', applyPlan:true};
function renderOnboarding(){
  $('#app').innerHTML = ''; $('#fab').style.display = 'none';
  document.querySelector('.tabbar').style.display = 'none';
  if (!ob.payday) ob.payday = state.nextPayday && state.nextPayday > today() ? state.nextPayday : addMonths(today(), 1);
  const step = ui.obStep;
  let body;
  if (step === 0){
    body = `<div class="logo">💸</div><h1>هلا بك في «إعانتي»</h1><p class="lead">نظّم إعانتك الجامعية، اعرف كم يحق لك تصرف كل يوم، وادّخر لأهدافك — بدون تعقيد.</p>
      <div class="section-title">اختر فئتك (تقدر تعدّل المبلغ)</div>
      ${[['basic','🎓','إعانة أساسية','المكافأة الطلابية الأساسية',200],['rare','⭐','تخصص نادر / تفوّق','إعانة التخصصات النادرة أو المتفوقين',350],['custom','💼','مخصص + دخل إضافي','عمل طلابي، مشروع جانبي، أو مبلغ مختلف',null]].map(([id, em, n, d, a]) => `
        <button class="tier ${ob.tier === id ? 'on' : ''}" data-a="obTier" data-id="${id}"><span class="em">${em}</span><div class="grow"><b>${n}</b><span>${d}</span></div>${a ? `<span class="amt">${KD(a)}</span>` : '<span class="amt">✏️</span>'}</button>`).join('')}
      <div class="two" style="margin-top:6px"><div class="field"><label>الإعانة الشهرية (د.ك)</label><input class="inp" id="obAl" inputmode="decimal" value="${ob.allowance}"></div>
      <div class="field"><label>دخل إضافي (د.ك)</label><input class="inp" id="obEx" inputmode="decimal" value="${ob.extra}" placeholder="0"></div></div>
      ${ob.tier === 'custom' ? '<div class="hint" style="margin-top:-6px;margin-bottom:10px">💼 مثل مكافأة عمل طلابي أو دخل مشروع جانبي — نضيفه لدخلك الشهري.</div>' : ''}
      <button class="btn block" data-a="obNext">التالي ←</button>`;
  } else {
    const inc = r3(ob.allowance + ob.extra);
    body = `<div class="logo">📅</div><h1>آخر خطوة!</h1><p class="lead">حدد متى تنزل الإعانة الجاية عشان نحسب لك المسموح اليومي.</p>
      <div class="field"><label>اسمك (اختياري)</label><input class="inp" id="obName" value="${esc(ob.name)}" placeholder="مثلاً: عمر" maxlength="24"></div>
      <div class="field"><label>تاريخ نزول الإعانة القادمة</label><input class="inp" id="obPd" type="date" value="${ob.payday}" min="${addDays(today(), 1)}"><div class="hint" id="obDays">${obDaysText(ob.payday)}</div></div>
      <label class="checkline" style="margin-bottom:14px"><input type="checkbox" id="obPlan" ${ob.applyPlan ? 'checked' : ''}><span>⚖️ وزّع التزاماتي تلقائيًا حسب <b>الخطة المتوازنة</b> على ${KD(inc)} (بانزين، إنترنت، اشتراكات، صدقة، ملابس، وادخار 20%) — تقدر تعدّلها بعدين</span></label>
      <div class="btns"><button class="btn ghost" data-a="obBack">→ رجوع</button><button class="btn" data-a="obDone" style="flex:2">يلا نبدأ 🚀</button></div>`;
  }
  $('#onb').innerHTML = `<div class="onb"><div class="onb-in"><div class="dots"><i class="${step === 0 ? 'on' : ''}"></i><i class="${step === 1 ? 'on' : ''}"></i></div>${body}
    <div class="foot">🔒 كل بياناتك تبقى في جهازك فقط</div></div></div>`;
}
function obDaysText(pd){ if (!pd) return ''; const d = daysBetween(today(), pd); return d > 0 ? `⏳ باقي ${dayWord(d)} على الإعانة` : '⚠️ اختر تاريخ بعد اليوم'; }
function obCollect(){
  if ($('#obAl')){ ob.allowance = parseNum($('#obAl').value); ob.extra = parseNum($('#obEx').value); }
  if ($('#obName')){ ob.name = $('#obName').value.trim(); ob.payday = $('#obPd').value; ob.applyPlan = $('#obPlan').checked; }
}

/* ============ الأحداث ============ */
const ACT = {
  go: d => { ui.view = d.v; location.hash = d.v; render(); window.scrollTo(0, 0); },
  close: closeSheet,
  toggleTheme: () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark'; state.theme = dark ? 'light' : 'dark'; commit(); },
  setTheme: d => { state.theme = d.id; save(); applyTheme(); render(); sheetSettings(); },
  settings: sheetSettings, saveSettings,
  addExp: d => sheetExpense(d.cat),
  pickCat: d => { expDraftCat = d.id; document.querySelectorAll('#catPick button').forEach(b => b.classList.toggle('on', b.dataset.id === d.id)); },
  quickAmt: d => { const i = $('#exAmt'); i.value = r3(parseNum(i.value) + parseFloat(d.v)); },
  saveExp: saveExpense,
  delExp: d => askConfirm('🗑️ حذف المصروف', 'متأكد تبي تحذفه؟', 'احذف', () => { state.expenses = state.expenses.filter(e => e.id !== d.id); commit(); toast('انحذف'); }, true),
  expPeriod: d => { ui.expPeriod = d.id; render(); },
  expCat: d => { ui.expCat = d.id; render(); },
  donut: d => { ui.donutSel = ui.donutSel === d.id ? null : d.id; render(); },
  paid: d => { const it = state.commitments.find(x => x.id === d.id); if (!it || !it.active) return; if (state.cycle.paid[it.id]) { if (unpay(it)) commit(); } else { pay(it); commit(); toast(it.type === 'save' ? `🐷 ${KDt(it.amount)} انتقلت للحصالة` : 'تم ✓'); } },
  toggleActive: d => { const it = state.commitments.find(x => x.id === d.id); if (it.active && state.cycle.paid[it.id] && !unpay(it)) return; it.active = !it.active; commit(); },
  editCommit: d => sheetCommit(d.id),
  pickIcon: d => { editIcon = d.e; document.querySelectorAll('#icPick button').forEach(b => b.classList.toggle('on', b.dataset.e === d.e)); },
  saveCommit: d => saveCommit(d.id),
  delCommit: d => { const it = state.commitments.find(x => x.id === d.id); askConfirm('🗑️ حذف البند', `بنحذف «${esc(it.name)}» من التزاماتك.`, 'احذف', () => { if (state.cycle.paid[it.id] && !unpay(it)) return; state.commitments = state.commitments.filter(x => x.id !== it.id); commit(); }, true); },
  newCycle: sheetNewCycle, doNewCycle,
  vaultOp: d => sheetVault(d.op, d.goal),
  doVault: d => doVault(d.op),
  editGoal: d => sheetGoal(d.id, d.preset != null ? +d.preset : null),
  goalPreset: d => { const p = GOAL_PRESETS[+d.i]; $('#gName').value = p.name; $('#gTarget').value = p.target; goalEmoji = p.emoji; document.querySelectorAll('#gEm button').forEach(b => b.classList.toggle('on', b.dataset.e === p.emoji)); gPlan(true); },
  pickGoalEm: d => { goalEmoji = d.e; document.querySelectorAll('#gEm button').forEach(b => b.classList.toggle('on', b.dataset.e === d.e)); },
  saveGoal: d => saveGoal(d.id),
  delGoal: d => askConfirm('🗑️ حذف الهدف', 'المبلغ المدخر للهدف يرجع للحصالة العامة، وما يضيع شي.', 'احذف', () => { state.vault.forEach(v => { if (v.goal === d.id) v.goal = null; }); state.commitments.forEach(c => { if (c.goal === d.id) c.goal = null; }); state.goals = state.goals.filter(g => g.id !== d.id); commit(); }, true),
  templates: sheetTemplates,
  applyTpl: d => { const t = TEMPLATES.find(x => x.id === d.id); askConfirm(`${t.icon} تطبيق الخطة`, 'بنعدّل مبالغ التزاماتك حسب هالخطة. تقدر تغيّر أي بند بعدين.', 'طبّق', () => applyTemplate(d.id)); },
  exportJSON, importJSON: () => $('#importFile').click(),
  exportCSV: d => exportCSV(d.scope),
  install: sheetInstall,
  hideInstall: () => { state.installHintHidden = true; commit(); },
  promptInstall: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; closeSheet(); },
  reOnboard: () => { closeSheet(); Object.assign(ob, {tier:state.profile.tier || 'basic', allowance:state.profile.allowance, extra:state.profile.extra, name:state.profile.name, payday:state.nextPayday, applyPlan:false}); ui.obStep = 0; state.onboarded = false; render(); },
  resetAll: () => askConfirm('🗑️ مسح كل البيانات', 'بنمسح كل شي (الالتزامات، المصروفات، الحصالة والأهداف). ما نقدر نرجعها إلا من نسخة احتياطية.', 'امسح كل شي', () => { state = defaultState(); try { localStorage.removeItem(KEY); } catch(e){} ui.obStep = 0; Object.assign(ob, {tier:'basic', allowance:200, extra:0, name:'', payday:'', applyPlan:true}); render(); }, true),
  nw: d => { const it = NW_ITEMS[+d.i]; ui.nwRevealed[d.i] = {ok: it[1] === d.g}; render(); },
  chal: (d, el) => { ui.challenge[d.id] = el.checked; render(); },
  obTier: d => { obCollect(); ob.tier = d.id; if (d.id === 'basic') ob.allowance = 200; if (d.id === 'rare') ob.allowance = 350; render(); if (d.id === 'custom') setTimeout(() => $('#obEx') && $('#obEx').focus(), 50); },
  obNext: () => { obCollect(); if (!(ob.allowance > 0) && !(ob.extra > 0)) { toast('دخّل مبلغ الإعانة'); return; } ui.obStep = 1; render(); },
  obBack: () => { obCollect(); ui.obStep = 0; render(); },
  obDone: () => {
    obCollect();
    if (!ob.payday || ob.payday <= today()) { toast('اختر تاريخ الإعانة القادمة (بعد اليوم)'); return; }
    const first = !state.cycles.length && !state.expenses.length && !state.vault.length;
    Object.assign(state.profile, {tier:ob.tier, allowance:ob.allowance, extra:ob.extra, name:ob.name});
    state.nextPayday = ob.payday;
    if (ob.applyPlan){
      const items = planItems(TEMPLATES[0], r3(ob.allowance + ob.extra));
      if (first) state.commitments = items;
      else items.forEach(ni => { const it = state.commitments.find(x => x.id === ni.id); if (it && !(state.cycle.paid[it.id] && it.type === 'save')) { it.amount = ni.amount; it.active = ni.active; } });
    }
    if (first) state.cycle = {id:state.cycle.id, start:today(), paid:{}};
    state.onboarded = true; ui.view = 'home'; location.hash = 'home';
    commit(); toast('يلا! خلّ إعانتك تكفيك لآخر الشهر 💪');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.a];
  if (fn){ e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('input[data-a]');
  if (el && ACT[el.dataset.a]) ACT[el.dataset.a](el.dataset, el, e);
  if (e.target.id === 'obPd' && $('#obDays')) $('#obDays').textContent = obDaysText(e.target.value);
});
document.addEventListener('input', e => {
  const t = e.target, w = t.dataset && t.dataset.in;
  if (w === 'gcalc') $('#gcOut').innerHTML = gcText(parseNum($('#gcT').value), parseNum($('#gcM').value));
  if (w === 'habit') $('#hbOut').innerHTML = habitOut(parseNum($('#hbA').value), parseNum($('#hbD').value));
  if (w === 'savefirst') $('#svOut').innerHTML = saveOut(parseNum($('#svA').value), Math.round(parseNum($('#svM').value)));
  if (w === 'gplan') gPlan(true);
  if (t.id === 'obPd' && $('#obDays')) $('#obDays').textContent = obDaysText(t.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'exAmt') saveExpense();
});
function routeFromHash(){ const h = location.hash.replace('#', ''); if (TABS.some(t => t.id === h)) ui.view = h; }
window.addEventListener('hashchange', () => { routeFromHash(); if (state.onboarded) render(); });
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'auto') render(); }); } catch(e){} }
// تحديث تلقائي عند تغيّر اليوم أو الرجوع للتطبيق
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden){ state = load(); if (today() !== lastDay){ lastDay = today(); } render(); } });

routeFromHash();
render();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
