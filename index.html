<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الإدارة المالية</title>
<meta name="description" content="الإدارة المالية: تطبيق مجاني للطلبة والموظفين لتوزيع الإعانة أو الراتب على خانات واضحة بالدينار الكويتي. بياناتك تبقى في جهازك.">
<meta name="theme-color" content="#f3f5fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الإدارة المالية">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa;--card:#ffffff;--card2:#f4f6fb;--text:#0c1530;--muted:#66708e;--line:#e3e7f0;
  --navy:#12275a;--navy2:#1d3b80;--org:#ff7a1a;--org2:#ff9c47;--org-soft:#fff1e6;--link:#e2600a;
  --red:#e0413b;--red-soft:#fdeaea;--yel:#c27c00;--yel-soft:#fff4d8;--grn:#15985a;--grn-soft:#e1f5ea;
  --shadow:0 1px 2px rgba(12,21,48,.04),0 8px 24px rgba(12,21,48,.07);
  --fd:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#070c1c;--card:#0f1830;--card2:#14203e;--text:#eaf0ff;--muted:#95a2c5;--line:#1f2c4f;
  --org:#ff8a33;--org2:#ffa65c;--org-soft:#33200f;--link:#ff9d52;
  --red:#ff6b64;--red-soft:#3a1616;--yel:#ffc24d;--yel-soft:#33280e;--grn:#3fd68b;--grn-soft:#0f2e20;--shadow:0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(10px + var(--safe-t)) 18px calc(18px + var(--safe-b))}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.i{display:inline-grid;place-items:center}
.i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:13px}.neg{color:var(--red)!important}.pos{color:var(--grn)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.sp{flex:1}

/* ===== الرأس ===== */
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.top .lg{width:38px;height:38px;border-radius:12px;overflow:hidden;flex:none}
.top .lg svg{width:100%;height:100%;display:block}
.top h1{font-family:var(--fd);font-size:17px;margin:0;font-weight:700;flex:1;line-height:1.3}
.top h1 small{display:block;font-family:"IBM Plex Sans Arabic";font-size:12.5px;color:var(--muted);font-weight:500}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--navy)}
[data-theme="dark"] .icon-btn{color:var(--text)}
.icon-btn:active{transform:scale(.92)}

/* ===== بطاقة الرصيد ===== */
.bal{background:radial-gradient(130% 150% at 100% 0%,#24489a 0%,#152d68 48%,#0c1a3d 100%);color:#fff;border-radius:28px;padding:20px 20px 18px;position:relative;overflow:hidden;box-shadow:0 18px 36px rgba(18,39,90,.28)}
[data-theme="dark"] .bal{box-shadow:none;border:1px solid #20356a}
.bal::after{content:"";position:absolute;left:-80px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.42),transparent 68%)}
.bal > *{position:relative;z-index:1}
.bal .lbl{display:flex;align-items:center;justify-content:space-between;font-size:14px;opacity:.92}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{background:rgba(63,214,139,.16);color:#7ff0b5}.pill.yellow{background:rgba(255,194,77,.16);color:#ffd27a}.pill.red{background:rgba(255,107,100,.18);color:#ffa19c}
.bal .big{font-family:var(--fd);font-size:50px;font-weight:800;line-height:1.1;margin:8px 0 2px}
.bal .big small{font-size:19px;font-weight:600;color:var(--org2)}
.bal .big.neg{color:#ffa19c!important}
.bal .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bal .stats div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:9px 12px}
.bal .stats b{display:block;font-family:var(--fd);font-size:17px;font-weight:700}
.bal .stats span{font-size:12px;opacity:.78}
.due{display:flex;align-items:center;gap:10px;background:var(--org-soft);color:var(--link);border-radius:18px;padding:12px 14px;margin-top:12px;font-weight:600;font-size:14px}

/* ===== زر الإضافة ===== */
.add-big{width:100%;margin:14px 0 18px;height:64px;border-radius:22px;background:linear-gradient(135deg,var(--org2),var(--org));color:#fff;font-family:var(--fd);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 28px rgba(255,122,26,.35);transition:transform .12s}
.add-big .i svg{width:26px;height:26px;stroke-width:2.6}
.add-row{display:flex;gap:10px;margin:14px 0 18px}.add-row .add-big{margin:0;flex:1}
.add-inc{width:92px;height:64px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;border:2px solid var(--line)}
[data-theme="dark"] .add-inc{color:var(--text)}
.add-inc .i svg{width:22px;height:22px;stroke-width:2.6;color:var(--grn)}
.add-inc:active{transform:scale(.95)}
.pick button.dest{background:var(--grn-soft)}
.add-big:active{transform:scale(.97)}

/* ===== كروت الخانات ===== */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec-h b{font-family:var(--fd);font-size:16px}
.link{color:var(--link);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link .i svg{width:17px;height:17px}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 14px;margin:0 -18px;scrollbar-width:none;scroll-padding:0 18px}
.cards::-webkit-scrollbar{display:none}
.bcard{flex:0 0 58%;max-width:260px;scroll-snap-align:start;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px 16px 20px;text-align:start;position:relative;overflow:hidden;transition:transform .15s}
.bcard:active{transform:scale(.97)}
.bcard .h{display:flex;align-items:center;gap:10px}
.bcard .em{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none}
.bcard .nm{font-weight:700;font-size:15px;line-height:1.3}
.bcard .v{font-family:var(--fd);font-size:34px;font-weight:800;margin-top:14px;line-height:1.1;color:var(--navy)}
[data-theme="dark"] .bcard .v{color:var(--text)}
.bcard .v small{font-size:14px;color:var(--org);font-weight:700}
.bcard .cap{font-size:12.5px;color:var(--muted)}
.bcard .ln{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--card2)}
.bcard .ln i{display:block;height:100%}
.bcard.new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--link);border:2px dashed var(--line);box-shadow:none;background:transparent;font-weight:700}
.bcard.new .i svg{width:30px;height:30px}
.pager{display:flex;justify-content:center;gap:6px;margin-top:-2px}
.pager i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:all .2s}
.pager i.on{width:18px;background:var(--org)}

/* ===== الروابط السفلية ===== */
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.links button{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--text)}
.links button .i{width:44px;height:44px;border-radius:14px;background:var(--card2);color:var(--navy)}
[data-theme="dark"] .links button .i{color:var(--org)}
.links button:active{transform:scale(.95)}
.links small{font-family:var(--fd);font-size:12px;color:var(--muted);font-weight:600}

/* ===== عام ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:15px;font-weight:700;font-size:15px;background:var(--org);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}.btn.soft{background:var(--org-soft);color:var(--link)}.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;font-size:14.5px;line-height:1.35}
.item .s{font-size:12.5px;color:var(--muted)}
.item.off{opacity:.45}
.ic{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.amt{font-family:var(--fd);font-weight:700;white-space:nowrap}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.check .i svg{width:18px;height:18px;stroke-width:3}
.check.on{background:var(--org);border-color:var(--org);color:#fff}
.del{color:var(--muted);padding:6px;display:grid;place-items:center}
.del .i svg{width:19px;height:19px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:right .2s}
.sw.on{background:var(--org)}.sw.on::after{right:21px}
.prog{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--org2),var(--org))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg-c{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg-c button{flex:1;padding:8px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg-c button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.day-h{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 0;display:flex;justify-content:space-between}
.panel{background:var(--card2);border-radius:18px;padding:14px;margin-bottom:12px}
.bigv{font-family:var(--fd);font-size:34px;font-weight:800;line-height:1.15}
.bigv small{font-size:15px;color:var(--org);font-weight:700}
.section-title{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.alloc{margin-top:12px;padding:12px;border-radius:16px;background:var(--card2);font-size:13px}
.box-edit{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.box-edit .ic{border:1.5px dashed var(--line)}
.box-edit .nm{flex:1;min-width:0}
.box-edit .lim{width:92px;text-align:center;font-family:var(--fd);font-weight:700}
.goal{padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;background:var(--card2)}
.goal .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.goal .em{font-size:28px}
.goal .pct{font-family:var(--fd);font-weight:800;color:var(--link);font-size:18px}

/* ===== النوافذ ===== */
.overlay{position:fixed;inset:0;background:rgba(4,9,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:93vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + var(--safe-b));transform:translateY(30px);transition:transform .25s}
.overlay.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--fd);margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:28px;max-height:88vh}}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:16px;outline:none}
.inp:focus{border-color:var(--org)}
.inp.big{font-family:var(--fd);font-size:30px;font-weight:700;text-align:center;padding:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:21px}
.emojis button.on{border-color:var(--org);background:var(--org-soft)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px;cursor:pointer}
.checkline input{width:20px;height:20px;accent-color:var(--org);flex:none;margin-top:2px}

/* ===== إضافة مصروف ===== */
.amt-disp{text-align:center;margin:2px 0}
.amt-disp b{font-family:var(--fd);font-size:54px;font-weight:800;line-height:1.1;display:inline-block}
.amt-disp span{font-size:19px;color:var(--org);font-weight:700}
.amt-disp.empty b{opacity:.22}
.amt-disp.bump b{animation:bump .18s ease}
.amt-disp.shake{animation:shake .35s}
@keyframes bump{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.keypad button{height:54px;border-radius:16px;background:var(--card2);font-family:var(--fd);font-size:24px;font-weight:600;transition:transform .08s,background .15s;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.keypad button:active{transform:scale(.93);background:var(--org-soft)}
.pick-h{text-align:center;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--muted);transition:color .2s}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;transition:opacity .2s}
.pick button{border-radius:18px;padding:10px 4px;background:var(--card2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;line-height:1.25;transition:all .15s}
.pick button .em{font-size:26px;line-height:1.1}
.pick button small{font-family:var(--fd);font-size:11px;color:var(--muted);font-weight:600}
.pick button.pre{border-color:var(--org)}
.pick button:active{transform:scale(.94);background:var(--org-soft)}
.pick.off{opacity:.45}
.pick-wrap.ready .pick-h{color:var(--link)}
.note-t{display:block;margin:12px auto 0;color:var(--muted);font-size:13px;font-weight:600}

/* ===== الإعداد الأول ===== */
.onb{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto}
.onb-in{max-width:480px;margin:0 auto;padding:calc(30px + var(--safe-t)) 22px calc(30px + var(--safe-b))}
.logo{width:88px;height:88px;border-radius:26px;overflow:hidden;margin:0 auto 16px;box-shadow:0 14px 30px rgba(18,39,90,.28)}
.logo svg{width:100%;height:100%;display:block}
.onb h1{font-family:var(--fd);text-align:center;margin:0;font-size:25px}
.onb .lead{text-align:center;color:var(--muted);margin:6px 0 22px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}.who button:last-child:nth-child(odd){grid-column:1/-1}
.who button{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.who button .em{font-size:46px;line-height:1}
.who button b{font-family:var(--fd);font-size:17px}
.who button span{font-size:12.5px;color:var(--muted)}
.who button:active{transform:scale(.96);border-color:var(--org)}
.tier{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:9px}
.tier.on{border-color:var(--org);background:var(--org-soft)}
.tier .em{font-size:24px}.tier b{font-size:15px}.tier .amt{color:var(--link)}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:24px;background:var(--org)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}

.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translate(-50%,-20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:60;max-width:92vw;pointer-events:none;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.act{pointer-events:auto}
.toast button{color:var(--org2);font-weight:700;white-space:nowrap}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 4px}
.foot b{color:var(--text)}
.install-steps{margin:0;padding:0 20px 0 0}.install-steps li{margin-bottom:8px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:13px}

/* ===== شاشة الدخول ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(110% 70% at 50% 35%,#1d3c85 0%,#10224f 50%,#050b1f 100%);color:#fff;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash::before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.28),transparent 65%);animation:glow 1.8s ease-in-out infinite alternate}
#splash .sp-logo{width:128px;height:128px;border-radius:32px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.45);animation:popIn .7s cubic-bezier(.2,1.5,.4,1) both;position:relative}
#splash .sp-logo svg{width:100%;height:100%;display:block}
#splash .seg{animation:draw .9s cubic-bezier(.6,0,.3,1) both}
#splash .seg:nth-child(2){animation-delay:.15s}#splash .seg:nth-child(3){animation-delay:.3s}
#splash .mark{transform-origin:256px 256px;animation:markIn .55s .65s cubic-bezier(.2,1.6,.4,1) both}
#splash .sp-name{font-family:var(--fd);font-size:36px;font-weight:800;margin-top:16px;animation:rise .6s .55s both;position:relative}
#splash .sp-name span{color:var(--org)}
#splash .sp-tag{font-size:15px;opacity:.85;animation:rise .6s .7s both;position:relative}
#splash .sp-foot{position:absolute;bottom:calc(28px + var(--safe-b));font-size:12.5px;opacity:.65;animation:rise .6s .9s both}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dasharray:0 2000}}
@keyframes markIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{from{transform:scale(.85);opacity:.6}to{transform:scale(1.1);opacity:1}}
.enter > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.06s}.enter > *:nth-child(3){animation-delay:.12s}.enter > *:nth-child(4){animation-delay:.18s}.enter > *:nth-child(n+5){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" role="presentation"><div class="sp-logo" id="spLogo"></div><div class="sp-name">الإدارة المالية<span>.</span></div><div class="sp-tag">نظّم أموالك… لآخر الشهر</div><div class="sp-foot">تم تصميم الموقع من قبل المهندس بو عمر</div></div>
<div class="app" id="app"></div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="onb"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============ الشعار ============ */
function logoSVG(){
  const C = 2 * Math.PI * 136, gap = 20, parts = [[.52, 'url(#lgO)'], [.28, '#ffffff'], [.20, '#ffc58f']];
  let off = 0;
  const segs = parts.map(([f, col]) => { const L = f * C - gap; const s = `<circle class="seg" cx="256" cy="256" r="136" fill="none" stroke="${col}" stroke-width="60" stroke-dasharray="${L.toFixed(1)} ${(C - L).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 256 256)"/>`; off += f * C; return s; }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="lgN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22418c"/><stop offset=".55" stop-color="#132a5e"/><stop offset="1" stop-color="#0a1633"/></linearGradient><radialGradient id="lgG" cx=".85" cy=".9" r=".7"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient><linearGradient id="lgO" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa04d"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs><rect width="512" height="512" fill="url(#lgN)"/><rect width="512" height="512" fill="url(#lgG)"/><g>${segs}</g><g class="mark"><circle cx="256" cy="256" r="74" fill="#ff7a1a"/><path d="M220 274l36-36 36 36" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
}
document.getElementById('spLogo').innerHTML = logoSVG();

/* ============ أيقونات ============ */
const ICON = {
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15.5l2 2 4-4"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/>',
  menu:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  back:'<path d="M9 6l6 6-6 6"/>',
  del:'<path d="M20 6H9l-5 6 5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12 10l4 4M16 10l-4 4"/>'
};
const I = n => `<span class="i"><svg viewBox="0 0 24 24">${ICON[n]}</svg></span>`;

/* ============ ثوابت ============ */
const KEY = 'e3anati.v1';
const MODES = {
  student:{label:'طالب جامعي', icon:'🎓', inc:'الإعانة', next:'الإعانة القادمة', incAsk:'الإعانة الشهرية', has:'لدي إعانة شهرية', ask:'كم إعانتك؟',
    commit:{fuel:15, net:5, subs:3, sadaqa:2, care:5, autosave:20},
    cats:[['coffee','☕','القهوة',15],['food','🍔','المطاعم',30],['study','📚','الدراسة',15],['fun','⚽','الطلعات',20],['car','🚗','السيارة',10],['shop','🛍️','المشتريات',10]]},
  school:{label:'طالب مدرسة', icon:'🎒', inc:'المصروف', next:'المصروف القادم', incAsk:'مصروفك الشهري من أهلك', has:'مصروف من أهلي', ask:'كم يعطيك أهلك في الشهر؟',
    commit:{sadaqa:5, autosave:25},
    cats:[['snack','🍫','المقصف والوجبات',30],['fun','⚽','الطلعات',25],['games','🎮','الألعاب والشحن',15],['study','📚','القرطاسية',10],['gifts','🎁','الهدايا',10],['shop','🛍️','المشتريات',10]]},
  employee:{label:'موظف', icon:'💼', inc:'الراتب', next:'الراتب القادم', incAsk:'الراتب الشهري', has:'لدي راتب شهري', ask:'كم راتبك؟',
    commit:{fuel:6, net:3, subs:2, sadaqa:2, care:4, family:10, autosave:20},
    cats:[['coffee','☕','القهوة',10],['food','🍔','المطاعم',25],['fun','⚽','الطلعات',20],['car','🚗','السيارة',10],['shop','🛍️','المشتريات',20],['gifts','🎁','الهدايا والمناسبات',15]]}
};
const BASE_ITEMS = {
  fuel:{icon:'⛽', name:'البنزين والمواصلات'}, net:{icon:'📶', name:'الإنترنت والهاتف'}, subs:{icon:'💻', name:'الاشتراكات'},
  sadaqa:{icon:'🤲', name:'الصدقة الشهرية'}, care:{icon:'👕', name:'الملابس والعناية'}, family:{icon:'🏠', name:'مصروف البيت'},
  autosave:{icon:'🐷', name:'الادخار الشهري', type:'save'}
};
const PALETTE = ['#ff7a1a','#2f6fe0','#14a38b','#e2483d','#8a5cf6','#c98a12','#0ea5c6','#d9468f','#5b6b8c'];
const BOX_ICONS = ['🍫','🎒','☕','🍔','📚','⚽','🚗','🛍️','🎁','🏠','⛽','📱','💊','🎮','✂️','🧳','🍬','🐈','📦','🎓','💼','🧾'];
const C_ICONS = ['⛽','📶','💻','🤲','👕','🏠','🐷','🔧','📱','🎓','🍽️','🚌','💊','🏋️','📦'];
const GOAL_PRESETS = [{emoji:'💻', name:'حاسوب', target:300}, {emoji:'🧳', name:'عمرة أو سفر', target:400}, {emoji:'🛟', name:'صندوق الطوارئ', target:150}, {emoji:'🚗', name:'سيارة', target:1500}];
const GOAL_EMOJIS = ['🎯','💻','📱','🎓','🧳','🛟','🚗','⌚','📷','🏠','📚','🏋️','🎁','💼'];

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const r3 = x => Math.round((+x || 0) * 1000) / 1000;
const r05 = x => Math.max(0, Math.round((+x || 0) * 2) / 2);
const sum = a => r3(a.reduce((s, x) => s + (+x || 0), 0));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(v){
  if (v == null) return 0;
  const s = String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.').replace(/[^\d.\-]/g, '');
  const n = parseFloat(s); return isFinite(n) ? r3(n) : 0;
}
function fmt(x){ const v = r3(x); return (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:3}); }
const KD = x => `<span class="num">${fmt(x)}</span> د.ك`;
const KDt = x => `${fmt(x)} د.ك`;
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
const today = () => iso(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
function addMonths(s, n){ const d = parseISO(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return iso(d); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(s, opt){ try { return parseISO(s).toLocaleDateString('ar-KW-u-nu-latn', opt || {day:'numeric', month:'long'}); } catch(e){ return s; } }
function daysWord(n){ if (n === 1) return 'يوم واحد'; if (n === 2) return 'يومان'; if (n >= 3 && n <= 10) return n + ' أيام'; return n + ' يومًا'; }
function monthsWord(n){ if (n === 1) return 'شهر واحد'; if (n === 2) return 'شهرين'; if (n >= 3 && n <= 10) return n + ' أشهر'; return n + ' شهرًا'; }
const vib = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

/* ============ الحالة ============ */
function buildCommitments(mode, income){
  const m = MODES[mode];
  return Object.keys(BASE_ITEMS).filter(id => m.commit[id] != null).map(id => ({id, icon:BASE_ITEMS[id].icon, name:BASE_ITEMS[id].name, type:BASE_ITEMS[id].type || 'normal', amount:r05(income * m.commit[id] / 100), active:true, goal:null}));
}
function buildCats(mode, spendable){
  return MODES[mode].cats.map(([id, icon, name, w], i) => ({id, icon, name, color:PALETTE[i % PALETTE.length], limit:r05(spendable * w / 100)}));
}
function defaultState(){
  const t = today(), commitments = buildCommitments('student', 200);
  return {v:3, onboarded:false, mode:'student', theme:'light', profile:{name:'', tier:'basic', allowance:200, extra:0},
    nextPayday:addMonths(t, 1), commitments, cats:buildCats('student', 200 - sum(commitments.map(c => c.amount))),
    cycle:{id:uid(), start:t, paid:{}}, cycles:[], expenses:[], incomes:[], vault:[], goals:[]};
}
function normalize(s){
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const o = Object.assign({}, d, s);
  o.profile = Object.assign({}, d.profile, s.profile || {});
  o.cycle = Object.assign({}, d.cycle, s.cycle || {}); o.cycle.paid = o.cycle.paid || {};
  for (const k of ['commitments','cycles','expenses','incomes','vault','goals']) if (!Array.isArray(o[k])) o[k] = d[k];
  if (!MODES[o.mode]) o.mode = 'student';
  if (!Array.isArray(s.cats) || !s.cats.length){ const inc = parseNum(o.profile.allowance) + parseNum(o.profile.extra); o.cats = buildCats(o.mode, inc - sum(o.commitments.filter(c => c.active).map(c => c.amount))); }
  if (s.v !== 3 && o.theme !== 'dark') o.theme = 'light';
  o.v = 3; return o;
}
function load(){ try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : defaultState(); } catch(e){ return defaultState(); } }
let state = load();
let storageOK = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; } catch(e){ if (storageOK) toast('تعذّر الحفظ في المتصفح — صدّر نسخة احتياطية'); storageOK = false; } }
function commit(){ save(); render(); }
const M = () => MODES[state.mode] || MODES.student;
const catOf = id => state.cats.find(c => c.id === id) || {id, icon:'📦', name:'خانة محذوفة', color:'#8a94ad', limit:0};

/* ============ الحسابات ============ */
function bucketBal(goalId){ return sum(state.vault.filter(v => (v.goal || null) === (goalId || null)).map(v => v.amount)); }
function calc(){
  const S = state, c = S.cycle.id, t = today();
  const incs = S.incomes.filter(x => x.cycle === c), received = sum(incs.map(x => x.amount));
  const bonus = {}; incs.forEach(x => { if (x.to && x.to !== 'free' && x.to !== 'save') bonus[x.to] = r3((bonus[x.to] || 0) + x.amount); });
  const allowance = parseNum(S.profile.allowance), extra = parseNum(S.profile.extra), income = r3(allowance + extra + received);
  const act = S.commitments.filter(x => x.active);
  const commitTotal = sum(act.map(x => x.amount));
  const commitSave = sum(act.filter(x => x.type === 'save').map(x => x.amount));
  const exps = S.expenses.filter(e => e.cycle === c);
  const expTotal = sum(exps.map(e => e.amount));
  const manualSave = sum(S.vault.filter(v => v.cycle === c && (v.src === 'manual' || v.src === 'withdraw')).map(v => v.amount));
  const free = r3(income - commitTotal - expTotal - manualSave);
  const todaySpent = sum(exps.filter(e => e.date === t).map(e => e.amount));
  const diff = daysBetween(t, S.nextPayday), daysLeft = Math.max(1, diff);
  const startToday = r3(free + todaySpent);
  const safeDaily = r3(Math.max(0, startToday) / daysLeft);
  const leftToday = r3(safeDaily - todaySpent);
  const spendable = r3(income - commitTotal - manualSave);
  const ratio = spendable > 0 ? expTotal / spendable : (expTotal > 0 ? 1 : 0);
  const totalSavings = sum(S.vault.map(v => v.amount));
  const spentBy = {}; exps.forEach(e => spentBy[e.cat] = r3((spentBy[e.cat] || 0) + e.amount));
  const boxes = S.cats.map(b => { const spent = spentBy[b.id] || 0, limit = r3(parseNum(b.limit) + (bonus[b.id] || 0)); return Object.assign({}, b, {spent, limit, left:r3(limit - spent), ratio: limit > 0 ? spent / limit : 0}); });
  const limitsTotal = sum(boxes.map(b => b.limit));
  const over = boxes.filter(b => b.limit > 0 && b.spent > b.limit + 0.0005);
  let status;
  if (free < 0) status = {cls:'red', label:'تجاوزت الميزانية'};
  else if (todaySpent > safeDaily + 0.0005) status = {cls:'red', label:'تجاوزت حد اليوم'};
  else if (over.length) status = {cls:'yellow', label:`تجاوزت خانة ${over[0].name}`};
  else if (ratio >= 0.75) status = {cls:'yellow', label:`صرفت ${Math.round(ratio * 100)}%`};
  else status = {cls:'green', label:'وضعك ممتاز'};
  return {received, incs, allowance, extra, income, commitTotal, commitSave, exps, expTotal, manualSave, free, todaySpent, diff, daysLeft, safeDaily, leftToday,
    spendable, ratio, totalSavings, boxes, limitsTotal, unalloc:r3(spendable - limitsTotal), status, savedThisCycle:r3(commitSave + manualSave)};
}

/* ============ الصفحة الرئيسية ============ */
let lastRender = 0;
function applyTheme(){ const d = state.theme === 'dark'; document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = d ? '#070c1c' : '#f3f5fa'; }
function render(){
  applyTheme();
  if (!state.onboarded){ renderOnboarding(); return; }
  $('#onb').innerHTML = '';
  const k = calc(), S = state, first = !lastRender; lastRender++;
  const keepScroll = $('#cards') ? $('#cards').scrollLeft : 0;
  const name = S.profile.name ? `مرحبًا، ${esc(S.profile.name)}` : 'مرحبًا بك';
  const paidN = S.commitments.filter(x => x.active && S.cycle.paid[x.id]).length, actN = S.commitments.filter(x => x.active).length;
  const box = b => {
    const pct = b.limit > 0 ? clamp(b.ratio) * 100 : 0;
    const col = b.limit > 0 && b.ratio > 1 ? 'var(--red)' : b.limit > 0 && b.ratio >= .75 ? 'var(--yel)' : b.color;
    return `<button class="bcard" data-a="boxOpen" data-id="${b.id}">
      <div class="h"><span class="em" style="background:color-mix(in srgb,${b.color} 15%,transparent)">${b.icon}</span><span class="nm">${esc(b.name)}</span></div>
      <div class="v ${b.limit > 0 && b.left < 0 ? 'neg' : ''}"><span class="num">${fmt(b.limit > 0 ? b.left : b.spent)}</span> <small>د.ك</small></div>
      <div class="cap">${b.limit > 0 ? (b.left >= 0 ? 'المتبقي' : 'تجاوزت الحد') : 'المصروف (بلا حد)'}</div>
      <div class="ln"><i style="width:${pct}%;background:${col}"></i></div></button>`;
  };
  $('#app').innerHTML = `<div class="${first ? 'enter' : ''}">
    <header class="top"><span class="lg">${logoSVG()}</span><h1>الإدارة المالية<small>${name}</small></h1>
      <button class="icon-btn" data-a="settings" aria-label="الإعدادات">${I('menu')}</button></header>
    <section class="bal">
      <div class="lbl"><span>رصيدك المتبقي</span><span class="pill ${k.status.cls}">${esc(k.status.label)}</span></div>
      <div class="big ${k.free < 0 ? 'neg' : ''}"><span class="num" data-count="${k.free}">${fmt(k.free)}</span> <small>د.ك</small></div>
      <div class="stats"><div><b>${KD(Math.max(0, k.safeDaily))}</b><span>يمكنك صرفه يوميًا</span></div>
        <div><b>${k.diff <= 0 ? 'اليوم' : daysWord(k.daysLeft)}</b><span>حتى ${M().next}</span></div></div>
      ${k.received > 0 ? `<div style="font-size:12.5px;opacity:.8;margin-top:10px">يشمل مبالغ واردة هذا الشهر: <span class="num">+${fmt(k.received)}</span> د.ك</div>` : ''}
    </section>
    ${k.diff <= 0 ? `<div class="due"><span class="grow">حان موعد ${M().inc}</span><button class="btn sm" data-a="newCycle">ابدأ شهرًا جديدًا</button></div>` : ''}
    <div class="add-row"><button class="add-big" data-a="addExp">${I('minus')} إضافة مصروف</button><button class="add-inc" data-a="addInc">${I('plus')}<span>مبلغ وارد</span></button></div>
    <div class="sec-h"><b>خاناتك</b><button class="link" data-a="boxesEdit">${I('edit')} تعديل</button></div>
    <div class="cards" id="cards">${k.boxes.map(box).join('')}<button class="bcard new" data-a="boxesEdit">${I('plus')}خانة جديدة</button></div>
    <div class="pager" id="pager">${k.boxes.map((b, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}<i></i></div>
    <div class="links">
      <button data-a="commitments">${I('cal')}الالتزامات<small>${paidN}/${actN} مدفوع</small></button>
      <button data-a="savings">${I('target')}الادخار<small class="num">${fmt(k.totalSavings)}</small></button>
      <button data-a="log">${I('list')}السجل<small class="num">${fmt(k.expTotal)}</small></button>
    </div>
    <div class="foot">تم تصميم الموقع من قبل <b>المهندس بو عمر</b></div></div>`;
  const cards = $('#cards');
  const syncPager = () => { const r = cards.getBoundingClientRect(); let best = 0, bd = 1e9; [...cards.children].forEach((c, i) => { const d = Math.abs(c.getBoundingClientRect().right - (r.right - 18)); if (d < bd){ bd = d; best = i; } }); [...$('#pager').children].forEach((p, i) => p.classList.toggle('on', i === best)); };
  cards.addEventListener('scroll', syncPager, {passive:true});
  if (keepScroll){ cards.scrollLeft = keepScroll; syncPager(); }
  if (first && !document.getElementById('splash')) countUp();
}

/* ============ النوافذ ============ */
function openSheet(html){ $('#sheet').innerHTML = `<div class="grab"></div>` + html; $('#sheet').scrollTop = 0; $('#ov').classList.add('show'); }
function closeSheet(){ $('#ov').classList.remove('show'); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
const head = (t, back) => `<h3>${back ? `<button class="del" data-a="${back}" aria-label="رجوع">${I('back')}</button>` : ''}${t}<span class="sp"></span><button class="del" data-a="close" aria-label="إغلاق">${I('x')}</button></h3>`;
let toastT;
function toast(msg, label, fn){
  const t = $('#toast'); t.innerHTML = '';
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);

  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('.keypad,.pick,input,select,.chips,.emojis')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
})();

render();
(function(){
  const sp = document.getElementById('splash'); if (!sp) return;
  let seen = false; try { seen = sessionStorage.getItem('fin-splash') === '1'; } catch(e){}
  const hide = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); try { sessionStorage.setItem('fin-splash', '1'); } catch(e){} setTimeout(() => { sp.remove(); if (state.onboarded) countUp(); }, 450); };
  if (seen){ sp.remove(); countUp(); return; }
  sp.addEventListener('click', hide); setTimeout(hide, 2000);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
