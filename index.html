<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعانتي — رتّب فلوسك</title>
<meta name="description" content="إعانتي: تطبيق مجاني للطلبة والموظفين الشباب لتوزيع الإعانة أو الراتب على خانات واضحة بالدينار الكويتي. بياناتك تبقى في جهازك.">
<meta name="theme-color" content="#12275a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إعانتي">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4fa;--card:#ffffff;--card2:#f5f7fc;--text:#0c1530;--muted:#5d6888;--line:#e1e6f1;
  --navy:#12275a;--navy2:#1f3f8a;--org:#ff7a1a;--org2:#ff9c47;--org-soft:#fff0e3;--link:#e2600a;--on-org:#fff;
  --red:#e0413b;--red-soft:#fdeaea;--yel:#c07a00;--yel-soft:#fff4d8;--grn:#15985a;--grn-soft:#e1f5ea;
  --shadow:0 1px 2px rgba(12,21,48,.05),0 10px 26px rgba(12,21,48,.07);
  --r:22px;--fd:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#060b1b;--card:#0e1730;--card2:#13203f;--text:#eaf0ff;--muted:#93a0c4;--line:#1f2c4f;
  --org:#ff8a33;--org2:#ffa65c;--org-soft:#33200f;--link:#ff9d52;--on-org:#fff;
  --red:#ff6b64;--red-soft:#3a1616;--yel:#ffc24d;--yel-soft:#33280e;--grn:#3fd68b;--grn-soft:#0f2e20;
  --shadow:0 0 0 1px rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:15px;min-height:100vh;transition:background .25s,color .25s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:600px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(100px + var(--safe-b))}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.i{display:inline-grid;place-items:center}
.i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.small{font-size:13px}.neg{color:var(--red)!important}.pos{color:var(--grn)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.sp{flex:1}

/* header */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{font-family:var(--fd);font-size:20px;margin:0;font-weight:700;flex:1;line-height:1.35}
.top h1 small{display:block;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:12.5px;color:var(--muted);font-weight:500}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--navy)}
[data-theme="dark"] .icon-btn{color:var(--text)}
.icon-btn:active{transform:scale(.92)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-family:var(--fd);font-size:16px;margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub-h{font-size:12.5px;color:var(--muted);margin-bottom:10px}

/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#24489a 0%,#152d68 45%,#0b1838 100%);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 16px 34px rgba(18,39,90,.3)}
[data-theme="dark"] .hero{box-shadow:none;border:1px solid #1f3466}
.hero::after{content:"";position:absolute;left:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.45),transparent 68%)}
.hero > *{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.92}
.pill{background:rgba(255,255,255,.13);padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.hero-num{font-family:var(--fd);font-size:48px;font-weight:800;margin:6px 0 0;line-height:1.1}
.hero-num small{font-size:18px;font-weight:600;color:var(--org2)}
.hero-sub{font-size:14px;opacity:.92;margin:2px 0 14px}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-row div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 10px}
.hero-row b{display:block;font-size:15px;font-family:var(--fd);font-weight:700}
.hero-row span{font-size:11.5px;opacity:.8}
.cycle-bar{height:6px;background:rgba(255,255,255,.14);border-radius:9px;margin-top:14px;overflow:hidden}
.cycle-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--org2),var(--org));border-radius:9px}
.cycle-cap{display:flex;justify-content:space-between;font-size:11.5px;opacity:.75;margin-top:5px}

/* alert */
.alert{border-radius:16px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.alert .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
.alert.green{background:var(--grn-soft);color:var(--grn)}
.alert.yellow{background:var(--yel-soft);color:var(--yel)}
.alert.red{background:var(--red-soft);color:var(--red)}
.alert.info{background:var(--org-soft);color:var(--link)}
.alert small{display:block;font-weight:500;opacity:.92;font-size:12.5px}

/* boxes (الخانات) */
.box{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 0;border-bottom:1px solid var(--line)}
.box:last-of-type{border-bottom:0}
.box:active{opacity:.7}
.ic{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.box b{font-size:14.5px;font-weight:600}
.box .left{font-family:var(--fd);font-weight:700;font-size:14px;white-space:nowrap}
.box .s{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.alloc{margin-top:12px;padding:12px;border-radius:16px;background:var(--card2);font-size:13px}
.alloc b{font-family:var(--fd)}
.box-edit{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.box-edit .ic{width:44px;height:44px;border:1.5px dashed var(--line)}
.box-edit .nm{flex:1;min-width:0}
.box-edit .lim{width:96px;text-align:center;font-family:var(--fd);font-weight:700}

/* summary tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card2);border-radius:16px;padding:11px 12px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--fd);font-size:18px;font-weight:700}
.tile .v small{font-size:11px;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--org);color:var(--on-org);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.soft{background:var(--org-soft);color:var(--link)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.link{color:var(--link);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.link .i svg{width:16px;height:16px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;font-size:14.5px;line-height:1.35}
.item .s{font-size:12.5px;color:var(--muted)}
.amt{font-family:var(--fd);font-weight:700;white-space:nowrap}
.item.off{opacity:.45}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.check .i svg{width:18px;height:18px;stroke-width:3}
.check.on{background:var(--org);border-color:var(--org);color:#fff}
.del{color:var(--muted);padding:6px;display:grid;place-items:center}
.del .i svg{width:19px;height:19px}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}
.empty .em{font-size:34px;display:block;margin-bottom:6px}
.day-h{font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 0;display:flex;justify-content:space-between}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:right .2s}
.sw.on{background:var(--org)}.sw.on::after{right:21px}
.prog{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--org2),var(--org))}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
[data-theme="dark"] .chip.on{background:var(--org);border-color:var(--org)}
.seg-c{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg-c button{flex:1;padding:8px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg-c button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* savings */
.vault{background:radial-gradient(130% 140% at 0% 0%,#ffa04d 0%,#ff7a1a 45%,#e85d00 100%);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 14px 28px rgba(255,122,26,.3)}
[data-theme="dark"] .vault{box-shadow:none}
.vault .big{font-family:var(--fd);font-size:38px;font-weight:800;line-height:1.2}
.vault .btns .btn{background:rgba(255,255,255,.2);color:#fff}
.goal{padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;background:var(--card2)}
.goal .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.goal .em{font-size:28px}
.goal .pct{font-family:var(--fd);font-weight:800;color:var(--link);font-size:18px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));z-index:20}
.tabbar nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
.tab.on{color:var(--link)}
.tab:active{transform:scale(.92)}
.fab{position:fixed;left:max(16px,calc(50% - 284px));bottom:calc(82px + var(--safe-b));width:60px;height:60px;border-radius:20px;background:var(--org);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px rgba(255,122,26,.42);z-index:19}
.fab .i svg{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.92)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(4,9,24,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(30px);transition:transform .25s}
.overlay.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--fd);margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:86vh}}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:16px;outline:none;transition:border .15s}
.inp:focus{border-color:var(--org)}
.inp.big{font-family:var(--fd);font-size:30px;font-weight:700;text-align:center;padding:10px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:21px}
.emojis button.on{border-color:var(--org);background:var(--org-soft)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px;cursor:pointer}
.checkline input{width:20px;height:20px;accent-color:var(--org);flex:none;margin-top:2px}
.section-title{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 8px}

/* keypad */
.cat-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.cat-row button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:10px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--card2);font-size:12px;font-weight:600;transition:all .15s;line-height:1.3}
.cat-row button .em{font-size:26px;line-height:1}
.cat-row button small{font-size:10.5px;color:var(--muted);font-family:var(--fd)}
.cat-row button.on{border-color:var(--org);background:var(--org-soft);color:var(--link);transform:translateY(-2px)}
.amt-disp{text-align:center;margin:6px 0 2px}
.amt-disp b{font-family:var(--fd);font-size:52px;font-weight:800;line-height:1.1;display:inline-block}
.amt-disp span{font-size:19px;color:var(--muted);font-weight:600}
.amt-disp.empty b{opacity:.25}
.amt-disp.bump b{animation:bump .18s ease}
.amt-disp.shake{animation:shake .35s}
@keyframes bump{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.keypad button{height:56px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-family:var(--fd);font-size:24px;font-weight:600;transition:transform .08s,background .15s;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.keypad button:active{transform:scale(.93);background:var(--org-soft)}
.more{margin-bottom:10px}
.more summary{list-style:none;cursor:pointer;text-align:center;color:var(--link);font-weight:600;font-size:13.5px;padding:4px}
.more summary::-webkit-details-marker{display:none}
.big-save{padding:15px;font-size:16.5px;border-radius:16px}

/* onboarding */
.onb{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto}
.onb-in{max-width:520px;margin:0 auto;padding:calc(26px + var(--safe-t)) 20px calc(30px + var(--safe-b))}
.logo{width:84px;height:84px;border-radius:24px;overflow:hidden;margin:0 auto 14px;box-shadow:0 14px 30px rgba(18,39,90,.3)}
.logo svg{width:100%;height:100%;display:block}
.onb h1{font-family:var(--fd);text-align:center;margin:0;font-size:25px}
.onb .lead{text-align:center;color:var(--muted);margin:6px 0 20px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.who button .em{font-size:44px;line-height:1}
.who button b{font-family:var(--fd);font-size:17px}
.who button span{font-size:12.5px;color:var(--muted)}
.who button:active{transform:scale(.96)}
.tier{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:9px}
.tier.on{border-color:var(--org);background:var(--org-soft)}
.tier .em{font-size:26px}
.tier b{display:block;font-size:15px}
.tier span{font-size:12.5px;color:var(--muted)}
.tier .amt{font-size:16px;color:var(--link)}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:24px;background:var(--org)}

.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translate(-50%,-20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:60;max-width:92vw;pointer-events:none;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.toast button{color:var(--org2);font-weight:700;font-size:14px;white-space:nowrap}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin:22px 0 6px;line-height:1.9}
.foot b{color:var(--text)}
.install-steps{margin:0;padding:0 20px 0 0}.install-steps li{margin-bottom:9px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-size:13px}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(110% 70% at 50% 35%,#1d3c85 0%,#10224f 50%,#050b1f 100%);color:#fff;transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash::before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.28),transparent 65%);animation:glow 1.8s ease-in-out infinite alternate}
#splash .sp-logo{width:132px;height:132px;border-radius:32px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.1);animation:popIn .7s cubic-bezier(.2,1.5,.4,1) both;position:relative}
#splash .sp-logo svg{width:100%;height:100%;display:block}
#splash .seg{stroke-dashoffset:var(--o);animation:draw .9s cubic-bezier(.6,0,.3,1) both}
#splash .seg:nth-child(2){animation-delay:.15s}#splash .seg:nth-child(3){animation-delay:.3s}
#splash .mark{transform-origin:256px 256px;animation:markIn .55s .65s cubic-bezier(.2,1.6,.4,1) both}
#splash .sp-name{font-family:var(--fd);font-size:38px;font-weight:800;margin-top:16px;animation:rise .6s .55s both;position:relative}
#splash .sp-name span{color:var(--org)}
#splash .sp-tag{font-size:15px;opacity:.85;animation:rise .6s .7s both;position:relative}
#splash .sp-foot{position:absolute;bottom:calc(28px + var(--safe-b));font-size:12.5px;opacity:.65;animation:rise .6s .9s both}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dasharray:0 2000}}
@keyframes markIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{from{transform:scale(.85);opacity:.6}to{transform:scale(1.1);opacity:1}}
.view.enter > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.enter > *:nth-child(2){animation-delay:.05s}.view.enter > *:nth-child(3){animation-delay:.1s}.view.enter > *:nth-child(4){animation-delay:.15s}.view.enter > *:nth-child(n+5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" role="presentation"><div class="sp-logo" id="spLogo"></div><div class="sp-name">إعانتي<span>.</span></div><div class="sp-tag">فلوسك… بخطة تكفيك لآخر الشهر</div><div class="sp-foot">تم تصميم الموقع من قبل المهندس بو عمر</div></div>
<div class="app" id="app"></div>
<div class="tabbar"><nav id="tabs"></nav></div>
<button class="fab" id="fab" data-a="addExp" aria-label="مصروف جديد"></button>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="onb"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============ الشعار ============ */
function logoSVG(anim){
  const C = 2 * Math.PI * 136, gap = 20, parts = [[.52, 'url(#lgO)'], [.28, '#ffffff'], [.20, '#ffc58f']];
  let off = 0;
  const segs = parts.map(([f, col]) => { const L = f * C - gap; const s = `<circle class="seg" style="--o:${(-off).toFixed(1)}" cx="256" cy="256" r="136" fill="none" stroke="${col}" stroke-width="60" stroke-dasharray="${L.toFixed(1)} ${(C - L).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 256 256)"/>`; off += f * C; return s; }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="lgN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22418c"/><stop offset=".55" stop-color="#132a5e"/><stop offset="1" stop-color="#0a1633"/></linearGradient><radialGradient id="lgG" cx=".85" cy=".9" r=".7"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient><linearGradient id="lgO" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa04d"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs><rect width="512" height="512" fill="url(#lgN)"/><rect width="512" height="512" fill="url(#lgG)"/><g>${segs}</g><g class="mark"><circle cx="256" cy="256" r="74" fill="#ff7a1a"/><path d="M220 274l36-36 36 36" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
}
document.getElementById('spLogo').innerHTML = logoSVG();

/* ============ أيقونات ============ */
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15.5l2 2 4-4"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/>',
  gear:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  back:'<path d="M9 6l6 6-6 6"/>',
  del:'<path d="M20 6H9l-5 6 5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12 10l4 4M16 10l-4 4"/>'
};
const I = n => `<span class="i"><svg viewBox="0 0 24 24">${ICON[n]}</svg></span>`;
document.getElementById('fab').innerHTML = I('plus');

/* ============ ثوابت ============ */
const KEY = 'e3anati.v1';
const MODES = {
  student:{label:'طالب جامعي', icon:'🎓', inc:'الإعانة', next:'الإعانة القادمة', incAsk:'الإعانة الشهرية', extraAsk:'دخل إضافي (عمل طلابي، مشروع)',
    commit:{fuel:15, net:5, subs:3, sadaqa:2, care:5, autosave:20},
    cats:[['coffee','☕','قهوة الجامعة',15],['food','🍔','مطاعم وكافتيريا',30],['study','📚','كتب وطباعة',15],['fun','⚽','طلعات وديوانية',20],['car','🚗','سيارة ومواقف',10],['shop','🛍️','مشتريات',10]]},
  employee:{label:'موظف', icon:'💼', inc:'الراتب', next:'الراتب القادم', incAsk:'الراتب الشهري', extraAsk:'دخل إضافي (عمل حر، مشروع)',
    commit:{fuel:6, net:3, subs:2, sadaqa:2, care:4, family:10, autosave:20},
    cats:[['coffee','☕','قهوة',10],['food','🍔','غداء ومطاعم',25],['fun','⚽','طلعات وأنشطة',20],['car','🚗','سيارة ومواقف',10],['shop','🛍️','مشتريات',20],['gifts','🎁','هدايا ومناسبات',15]]}
};
const BASE_ITEMS = {
  fuel:{icon:'⛽', name:'بانزين / مواصلات'},
  net:{icon:'📶', name:'باقة إنترنت / خط'},
  subs:{icon:'💻', name:'اشتراكات (أدوات، iCloud…)'},
  sadaqa:{icon:'🤲', name:'صدقة شهرية'},
  care:{icon:'👕', name:'ملابس / عناية شخصية'},
  family:{icon:'🏠', name:'مصروف البيت / الأهل'},
  autosave:{icon:'🐷', name:'ادخار تلقائي', type:'save'}
};
const PALETTE = ['#ff7a1a','#2f6fe0','#14a38b','#e2483d','#8a5cf6','#c98a12','#0ea5c6','#d9468f','#5b6b8c'];
const BOX_ICONS = ['☕','🍔','📚','⚽','🚗','🛍️','🎁','🏠','⛽','📱','💊','🎮','✂️','🧳','🍬','🐈','📦','🎓','💼','🧾'];
const C_ICONS = ['⛽','📶','💻','🤲','👕','🏠','🐷','🔧','📱','🎓','🍽️','🚌','💊','🏋️','📦'];
const GOAL_PRESETS = [
  {emoji:'💻', name:'لابتوب / آيباد', target:300}, {emoji:'🎓', name:'التخرج', target:250},
  {emoji:'🧳', name:'عمرة أو سفر', target:400}, {emoji:'🛟', name:'صندوق طوارئ', target:150}, {emoji:'🚗', name:'سيارة', target:1500}
];
const GOAL_EMOJIS = ['🎯','💻','📱','🎓','🧳','🛟','🚗','⌚','📷','🏠','📚','🏋️','🎮','🎁','💼'];

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const r3 = x => Math.round((+x || 0) * 1000) / 1000;
const r05 = x => Math.max(0, Math.round((+x || 0) * 2) / 2);
const sum = a => r3(a.reduce((s, x) => s + (+x || 0), 0));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(v){
  if (v == null) return 0;
  const s = String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.').replace(/[^\d.\-]/g, '');
  const n = parseFloat(s); return isFinite(n) ? r3(n) : 0;
}
function fmt(x){ const v = r3(x); return (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:3}); }
const KD = x => `<span class="num">${fmt(x)}</span> د.ك`;
const KDt = x => `${fmt(x)} د.ك`;
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
const today = () => iso(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
function addMonths(s, n){ const d = parseISO(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return iso(d); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
const LOC = 'ar-KW-u-nu-latn';
function fmtDate(s, opt){ try { return parseISO(s).toLocaleDateString(LOC, opt || {day:'numeric', month:'long'}); } catch(e){ return s; } }
function dayWord(n){ if (n === 1) return 'يوم واحد'; if (n === 2) return 'يومين'; if (n >= 3 && n <= 10) return n + ' أيام'; return n + ' يوم'; }
function monthWord(n){ if (n === 1) return 'شهر واحد'; if (n === 2) return 'شهرين'; if (n >= 3 && n <= 10) return n + ' أشهر'; return n + ' شهر'; }
const vib = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

/* ============ الحالة ============ */
function buildCommitments(mode, income){
  const m = MODES[mode];
  return Object.keys(BASE_ITEMS).filter(id => m.commit[id] != null).map(id => ({id, icon:BASE_ITEMS[id].icon, name:BASE_ITEMS[id].name, type:BASE_ITEMS[id].type || 'normal', amount:r05(income * m.commit[id] / 100), active:true, goal:null}));
}
function buildCats(mode, spendable){
  return MODES[mode].cats.map(([id, icon, name, w], i) => ({id, icon, name, color:PALETTE[i % PALETTE.length], limit:r05(spendable * w / 100)}));
}
function defaultState(){
  const t = today(), commitments = buildCommitments('student', 200);
  return {v:2, onboarded:false, mode:'student', theme:'auto',
    profile:{name:'', tier:'basic', allowance:200, extra:0},
    nextPayday:addMonths(t, 1), commitments, cats:buildCats('student', 200 - sum(commitments.map(c => c.amount))),
    cycle:{id:uid(), start:t, paid:{}}, cycles:[], expenses:[], vault:[], goals:[]};
}
function normalize(s){
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const o = Object.assign({}, d, s);
  o.profile = Object.assign({}, d.profile, s.profile || {});
  o.cycle = Object.assign({}, d.cycle, s.cycle || {}); o.cycle.paid = o.cycle.paid || {};
  for (const k of ['commitments','cycles','expenses','vault','goals']) if (!Array.isArray(o[k])) o[k] = d[k];
  if (!MODES[o.mode]) o.mode = 'student';
  if (!Array.isArray(s.cats) || !s.cats.length){
    const inc = parseNum(o.profile.allowance) + parseNum(o.profile.extra);
    o.cats = buildCats(o.mode, inc - sum(o.commitments.filter(c => c.active).map(c => c.amount)));
  }
  o.v = 2;
  return o;
}
function load(){ try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : defaultState(); } catch(e){ return defaultState(); } }
let state = load();
const ui = {view:'home', editBoxes:false, logPeriod:'cycle', logCat:'all', lastView:null};
let storageOK = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; } catch(e){ if (storageOK) toast('⚠️ المتصفح ما سمح بالحفظ — صدّر نسخة احتياطية'); storageOK = false; } }
function commit(){ save(); render(); }
const M = () => MODES[state.mode] || MODES.student;
const catOf = id => state.cats.find(c => c.id === id) || {id, icon:'📦', name:'خانة محذوفة', color:'#8a94ad', limit:0};

/* ============ الحسابات ============ */
function bucketBal(goalId){ return sum(state.vault.filter(v => (v.goal || null) === (goalId || null)).map(v => v.amount)); }
function calc(){
  const S = state, c = S.cycle.id, t = today();
  const allowance = parseNum(S.profile.allowance), extra = parseNum(S.profile.extra);
  const income = r3(allowance + extra);
  const act = S.commitments.filter(x => x.active);
  const commitTotal = sum(act.map(x => x.amount));
  const commitPaid = sum(act.filter(x => S.cycle.paid[x.id]).map(x => x.amount));
  const commitSave = sum(act.filter(x => x.type === 'save').map(x => x.amount));
  const exps = S.expenses.filter(e => e.cycle === c);
  const expTotal = sum(exps.map(e => e.amount));
  const manualSave = sum(S.vault.filter(v => v.cycle === c && (v.src === 'manual' || v.src === 'withdraw')).map(v => v.amount));
  const free = r3(income - commitTotal - expTotal - manualSave);
  const todaySpent = sum(exps.filter(e => e.date === t).map(e => e.amount));
  const diff = daysBetween(t, S.nextPayday), daysLeft = Math.max(1, diff);
  const startToday = r3(free + todaySpent);
  const safeDaily = r3(Math.max(0, startToday) / daysLeft);
  const leftToday = r3(safeDaily - todaySpent);
  const safeWeekly = r3(Math.max(0, startToday) * Math.min(7, daysLeft) / daysLeft);
  const spendable = r3(income - commitTotal - manualSave);
  const ratio = spendable > 0 ? expTotal / spendable : (expTotal > 0 ? 1 : 0);
  const totalSavings = sum(S.vault.map(v => v.amount));
  const cycleLen = Math.max(1, daysBetween(S.cycle.start, S.nextPayday));
  const elapsed = clamp(daysBetween(S.cycle.start, t) / cycleLen);
  const spentBy = {}; exps.forEach(e => spentBy[e.cat] = r3((spentBy[e.cat] || 0) + e.amount));
  const boxes = S.cats.map(b => { const spent = spentBy[b.id] || 0, limit = parseNum(b.limit); return Object.assign({}, b, {spent, limit, left:r3(limit - spent), ratio: limit > 0 ? spent / limit : 0}); });
  const orphan = r3(expTotal - sum(boxes.map(b => b.spent)));
  const limitsTotal = sum(boxes.map(b => b.limit));
  const unalloc = r3(spendable - limitsTotal);
  const over = boxes.filter(b => b.limit > 0 && b.spent > b.limit + 0.0005);

  let status;
  if (free < 0) status = {cls:'red', msg:`تجاوزت ميزانيتك بـ ${KDt(-free)}`, sub:'وقّف الصرف غير الضروري لين ' + M().next + '.'};
  else if (todaySpent > safeDaily + 0.0005) status = {cls:'red', msg:'تجاوزت الحد اليومي المقترح', sub:`صرفت اليوم ${KDt(todaySpent)} والمسموح ${KDt(safeDaily)} — خفّف بكرة ويتعدّل الحساب.`};
  else if (over.length) status = {cls:'yellow', msg:`تعدّيت حد خانة ${over[0].icon} ${over[0].name}`, sub:`صرفت ${KDt(over[0].spent)} من ${KDt(over[0].limit)}${over.length > 1 ? ` (و${over.length - 1} خانات ثانية)` : ''}.`};
  else if (ratio >= 0.75) status = {cls:'yellow', msg:`انتبه! صرفت ${Math.round(ratio*100)}% من ميزانية الصرف`, sub:`باقي لك ${KDt(Math.max(0, free))} لين ${fmtDate(S.nextPayday)}.`};
  else status = {cls:'green', msg:'وضعك ممتاز 👌', sub: expTotal > 0 ? `صارف ${Math.round(ratio*100)}% بس من ميزانية الصرف — كمّل كذا.` : 'سجّل أي مصروف أول بأول وخل الخانات تشتغل لك.'};

  return {allowance, extra, income, commitTotal, commitPaid, commitSave, exps, expTotal, manualSave, free, todaySpent, diff, daysLeft,
    safeDaily, leftToday, safeWeekly, spendable, ratio, totalSavings, elapsed, boxes, orphan, limitsTotal, unalloc, status, savedThisCycle:r3(commitSave + manualSave)};
}

/* ============ الواجهة ============ */
const TABS = [{id:'home', icon:'home', name:'الرئيسية'}, {id:'commit', icon:'cal', name:'الالتزامات'}, {id:'log', icon:'list', name:'السجل'}, {id:'save', icon:'target', name:'الادخار'}];
function isDark(){ let th = state.theme; if (th === 'auto') th = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; return th === 'dark'; }
function applyTheme(){ const d = isDark(); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = d ? '#060b1b' : '#12275a'; }
function render(){
  applyTheme();
  if (!state.onboarded){ renderOnboarding(); return; }
  $('#onb').innerHTML = '';
  const k = calc(), v = ui.view;
  const views = {home:viewHome, commit:viewCommit, log:viewLog, save:viewSave};
  const enter = ui.lastView !== v; ui.lastView = v;
  $('#app').innerHTML = header(k) + `<div class="view ${enter ? 'enter' : ''}">${(views[v] || viewHome)(k)}</div>` + footer();
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab ${t.id === v ? 'on' : ''}" data-a="go" data-v="${t.id}">${I(t.icon)}${t.name}</button>`).join('');
  $('#fab').style.display = (v === 'home' || v === 'log') && !ui.editBoxes ? '' : 'none';
  document.querySelector('.tabbar').style.display = '';
  if (enter && !document.getElementById('splash')) countUp();
}
function header(k){
  const titles = {commit:'الالتزامات الثابتة', log:'سجل المصروفات', save:'الادخار والأهداف'};
  const name = state.profile.name ? esc(state.profile.name) : 'هلا والله';
  const title = titles[ui.view] || (state.profile.name ? `هلا ${name} 👋` : 'هلا والله 👋');
  const sub = k.diff <= 0 ? `وصل موعد ${M().inc}؟ ابدأ شهر جديد` : `باقي ${dayWord(k.daysLeft)} على ${M().next}`;
  return `<header class="top"><h1>${title}<small>${sub}</small></h1>
    <button class="icon-btn" data-a="toggleTheme" aria-label="الوضع الليلي">${I(isDark() ? 'sun' : 'moon')}</button>
    <button class="icon-btn" data-a="settings" aria-label="الإعدادات">${I('gear')}</button></header>`;
}
function footer(){ return `<div class="foot">🔒 بياناتك محفوظة في جهازك فقط<br>تم تصميم الموقع من قبل <b>المهندس بو عمر</b></div>`; }

/* ---- الرئيسية ---- */
function viewHome(k){
  const S = state; let h = '';
  if (k.diff <= 0) h += `<div class="alert info"><span class="dot"></span><div class="grow">وصل موعد ${M().inc} (${fmtDate(S.nextPayday)})<small>إذا نزلت، ابدأ شهر جديد عشان تتصفّر الخانات والالتزامات.</small></div><button class="btn sm" data-a="newCycle">شهر جديد</button></div>`;
  h += `<section class="hero">
    <div class="hero-top"><span>المسموح تصرفه اليوم</span><span class="pill">⏳ ${k.diff <= 0 ? 'وصل الموعد' : 'باقي ' + dayWord(k.daysLeft)}</span></div>
    <div class="hero-num"><span class="num" data-count="${k.safeDaily}">${fmt(k.safeDaily)}</span> <small>د.ك</small></div>
    <div class="hero-sub">${k.leftToday >= 0 ? `باقي لك اليوم ${KD(k.leftToday)}` : `تعدّيت حد اليوم بـ ${KD(-k.leftToday)}`}</div>
    <div class="hero-row">
      <div><b class="${k.free < 0 ? 'neg' : ''}">${KD(k.free)}</b><span>الرصيد الحر</span></div>
      <div><b>${KD(k.safeWeekly)}</b><span>المسموح هالأسبوع</span></div>
      <div><b>${fmtDate(S.nextPayday)}</b><span>${M().next}</span></div>
    </div>
    <div class="cycle-bar"><i style="width:${(k.elapsed*100).toFixed(1)}%"></i></div>
    <div class="cycle-cap"><span>بداية الشهر ${fmtDate(S.cycle.start)}</span><span>مضى <span class="num">${Math.round(k.elapsed*100)}%</span></span></div>
  </section>`;
  h += `<div class="alert ${k.status.cls}"><span class="dot"></span><div class="grow">${k.status.msg}<small>${k.status.sub}</small></div></div>`;
  h += ui.editBoxes ? boxesEdit(k) : boxesCard(k);

function unpay(it){
  const entries = state.vault.filter(v => v.src === 'auto' && v.ref === it.id && v.cycle === state.cycle.id);
  for (const e of entries) if (bucketBal(e.goal) - e.amount < -0.0005){ toast('ما نقدر نلغي — المبلغ انسحب من الحصالة'); return false; }
  state.vault = state.vault.filter(v => !entries.includes(v)); delete state.cycle.paid[it.id]; return true;
}
function saveCommit(id){
  const name = $('#cmName').value.trim(), amt = parseNum($('#cmAmt').value);
  if (!name){ toast('اكتب اسم البند'); return; }
  if (amt < 0){ toast('المبلغ لازم يكون موجب'); return; }
  const type = $('#cmSave').checked ? 'save' : 'normal', goal = $('#cmGoal') ? ($('#cmGoal').value || null) : null;
  if (id){
    const it = state.commitments.find(x => x.id === id);
    if (state.cycle.paid[id] && it.type === 'save'){ if (!unpay(it)) return; Object.assign(it, {name, amount:amt, type, icon:editIcon, goal}); pay(it); }
    else Object.assign(it, {name, amount:amt, type, icon:editIcon, goal});
  } else state.commitments.push({id:uid(), icon:editIcon, name, amount:amt, type, goal, active:true});
  closeSheet(); commit(); toast('انحفظ ✓');
}

function doVault(op){

  const g = $('#vaGoal').value || null, base = {id:uid(), date:today(), ts:Date.now().toString(36), cycle:state.cycle.id, goal:g};

  else state.vault.push(Object.assign(base, {amount:amt, src:'manual', note:'إيداع'}));
  closeSheet(); commit(); vib(12); toast('تم ✓');
}

/* ---- تصدير / استيراد ---- */
function download(name, content, type){
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('تم التصدير ✓'); }
  catch(e){ toast('ما قدرنا نصدّر من هالمتصفح'); }
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCSV(){
  const k = calc(), rows = [['تقرير إعانتي', `${state.cycle.start} إلى ${state.nextPayday}`], [], ['الملخص', 'د.ك'],
    ['الدخل', k.income], ['الالتزامات الثابتة', k.commitTotal], ['المصروفات', k.expTotal], ['ادخار هالشهر', k.savedThisCycle], ['الرصيد الحر', k.free], ['مجموع الادخار', k.totalSavings], [],
    ['الخانة', 'الحد', 'صرفت', 'الباقي']];
  k.boxes.forEach(b => rows.push([b.name, b.limit, b.spent, b.left]));
  rows.push([], ['الالتزامات', 'المبلغ', 'الحالة']);
  state.commitments.filter(c => c.active).forEach(c => rows.push([c.name, c.amount, state.cycle.paid[c.id] ? 'مدفوع' : 'غير مدفوع']));
  rows.push([], ['التاريخ', 'الخانة', 'المبلغ', 'ملاحظة']);
  k.exps.slice().sort((a, b) => a.date > b.date ? 1 : -1).forEach(e => rows.push([e.date, catOf(e.cat).name, e.amount, e.note || '']));
  download(`e3anati-${today()}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.commitments) || !d.profile) throw 0;
      askConfirm('📂 استيراد نسخة', 'بنستبدل بياناتك الحالية بالنسخة. متأكد؟', 'استورد', () => { state = normalize(d); state.onboarded = true; commit(); toast('تم الاستيراد ✓'); });
    } catch(err){ toast('الملف مو نسخة صحيحة'); } e.target.value = ''; };
  rd.readAsText(f);
});

  boxIcon: d => boxIconSheet(d.id),
  setBoxIcon: d => { state.cats.find(c => c.id === d.id).icon = d.e; closeSheet(); commit(); },
  boxFit: () => { const k = calc(); if (k.spendable <= 0){ toast('ما فيه مبلغ متاح للتوزيع'); return; } const tot = k.limitsTotal, n = state.cats.length; if (!n) return;
    state.cats.forEach(c => c.limit = tot > 0 ? r05(parseNum(c.limit) / tot * k.spendable) : r05(k.spendable / n));
    const diff = r3(k.spendable - sum(state.cats.map(c => c.limit))); const big = state.cats.reduce((a, b) => parseNum(b.limit) > parseNum(a.limit) ? b : a); big.limit = r3(Math.max(0, parseNum(big.limit) + diff));
    commit(); toast('تم توزيع المتاح على خاناتك ✓'); },
  paid: d => { const it = state.commitments.find(x => x.id === d.id); if (!it || !it.active) return; if (state.cycle.paid[it.id]){ if (unpay(it)) commit(); } else { pay(it); commit(); vib(12); toast(it.type === 'save' ? `🐷 ${KDt(it.amount)} راحت للحصالة` : 'تم ✓'); } },
  toggleActive: d => { const it = state.commitments.find(x => x.id === d.id); if (it.active && state.cycle.paid[it.id] && !unpay(it)) return; it.active = !it.active; commit(); },
  editCommit: d => sheetCommit(d.id),
  pickIcon: d => { editIcon = d.e; document.querySelectorAll('#icPick button').forEach(b => b.classList.toggle('on', b.dataset.e === d.e)); },
  saveCommit: d => saveCommit(d.id),
  delCommit: d => { const it = state.commitments.find(x => x.id === d.id); askConfirm('🗑️ حذف البند', `بنحذف «${esc(it.name)}».`, 'احذف', () => { if (state.cycle.paid[it.id] && !unpay(it)) return; state.commitments = state.commitments.filter(x => x.id !== it.id); commit(); }, true); },
  newCycle: sheetNewCycle, doNewCycle,
  vaultOp: d => sheetVault(d.op, d.goal),
  doVault: d => doVault(d.op),
  editGoal: d => sheetGoal(d.id, d.preset != null ? +d.preset : null),
  goalPreset: d => { const p = GOAL_PRESETS[+d.i]; $('#gName').value = p.name; $('#gTarget').value = p.target; goalEmoji = p.emoji; document.querySelectorAll('#gEm button').forEach(b => b.classList.toggle('on', b.dataset.e === p.emoji)); gPlan(true); },
  pickGoalEm: d => { goalEmoji = d.e; document.querySelectorAll('#gEm button').forEach(b => b.classList.toggle('on', b.dataset.e === d.e)); },
  saveGoal: d => saveGoal(d.id),
  delGoal: d => askConfirm('🗑️ حذف الهدف', 'المبلغ المدخر له يرجع للحصالة، ما يضيع شي.', 'احذف', () => { state.vault.forEach(v => { if (v.goal === d.id) v.goal = null; }); state.commitments.forEach(c => { if (c.goal === d.id) c.goal = null; }); state.goals = state.goals.filter(g => g.id !== d.id); commit(); }, true),
  exportJSON: () => download(`e3anati-backup-${today()}.json`, JSON.stringify(state, null, 2), 'application/json'),
  importJSON: () => $('#importFile').click(),
  exportCSV,
  install: sheetInstall,
  promptInstall: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; closeSheet(); },
  resetAll: () => askConfirm('🗑️ مسح كل البيانات', 'بنمسح كل شي. ما يرجع إلا من نسخة احتياطية.', 'امسح', () => { state = defaultState(); try { localStorage.removeItem(KEY); } catch(e){} Object.assign(ob, {step:0, mode:'student', tier:'basic', allowance:200, extra:0, name:'', payday:''}); render(); }, true),
  obMode: d => { ob.mode = d.id; if (d.id === 'student'){ ob.allowance = ob.tier === 'rare' ? 350 : 200; } else { ob.allowance = 0; ob.tier = 'custom'; } ob.step = 1; render(); },
  obTier: d => { obCollect(); ob.tier = d.id; if (d.id === 'basic') ob.allowance = 200; if (d.id === 'rare') ob.allowance = 350; render(); if (d.id === 'custom') setTimeout(() => { const i = $('#obAl'); i.focus(); i.select(); }, 50); },
  obBack: () => { obCollect(); ob.step = Math.max(0, ob.step - 1); render(); },
  obNext: () => { obCollect();
    if (!(obIncome() > 0)){ toast('اكتب المبلغ'); return; }
    if (!ob.payday || ob.payday <= today()){ toast(`اختر موعد ${MODES[ob.mode].next} (بعد اليوم)`); return; }
    ob.commitments = buildCommitments(ob.mode, obIncome()); ob.cats = buildCats(ob.mode, obIncome() - sum(ob.commitments.map(c => c.amount)));
    ob.step = 2; render(); window.scrollTo(0, 0); },
  obDone: () => {
    const first = !state.cycles.length && !state.expenses.length && !state.vault.length;
    if (!first){ state = normalize(state); }
    Object.assign(state, {mode:ob.mode, nextPayday:ob.payday, commitments:ob.commitments, cats:ob.cats, onboarded:true});
    Object.assign(state.profile, {tier:ob.tier, allowance:ob.allowance, extra:ob.extra, name:ob.name});
    state.cycle = {id:state.cycle.id, start:today(), paid:{}};
    ui.view = 'home'; location.hash = 'home'; commit(); toast('يلا! خلّ فلوسك تكفيك لآخر الشهر 💪');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.a]; if (fn){ e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.boxLimit){ const b = state.cats.find(c => c.id === t.dataset.boxLimit); if (b){ b.limit = parseNum(t.value); save(); updAlloc(); } }
  if (t.dataset.boxName){ const b = state.cats.find(c => c.id === t.dataset.boxName); if (b){ b.name = t.value; save(); } }
  if (t.dataset.obLimit != null && ob.cats){ ob.cats[+t.dataset.obLimit].limit = parseNum(t.value);
    const un = r3(obIncome() - sum(ob.commitments.map(c => c.amount)) - sum(ob.cats.map(c => parseNum(c.limit))));
    $('#obAlloc').innerHTML = un < -0.0005 ? `<span class="neg">وزّعت أكثر من المتاح بـ ${KDt(-un)}</span>` : un > 0.0005 ? `باقي ${KDt(un)} بدون خانة (احتياط)` : '✅ كل فلوسك موزّعة'; }
  if (t.dataset.in === 'gplan') gPlan(true);
  if (t.id === 'obPd' && $('#obDays')) $('#obDays').textContent = obDaysText(t.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ($('#ov').classList.contains('show') && $('#amtDisp')){
    if (e.key === 'Enter'){ e.preventDefault(); saveExpense(); return; }
    if (e.target.tagName === 'INPUT') return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key); else if (e.key === '.' || e.key === ',') pressKey('.'); else if (e.key === 'Backspace') pressKey('⌫');
  }
});
function routeFromHash(){ const h = location.hash.replace('#', ''); if (TABS.some(t => t.id === h)) ui.view = h; }
window.addEventListener('hashchange', () => { routeFromHash(); if (state.onboarded) render(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'auto') render(); }); } catch(e){}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#ov').classList.contains('show') && !ui.editBoxes){ state = load(); render(); } });
function countUp(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => { const to = parseFloat(el.dataset.count); if (!(to > 0)) return; const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 850); el.textContent = fmt(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(to); }; requestAnimationFrame(step); });
}
(function(){
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('.keypad,input,select,.chips,.cat-row,.emojis')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
})();

routeFromHash();
render();
(function(){
  const sp = document.getElementById('splash'); if (!sp) return;
  let seen = false; try { seen = sessionStorage.getItem('e3-splash') === '1'; } catch(e){}
  const hide = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); try { sessionStorage.setItem('e3-splash', '1'); } catch(e){} setTimeout(() => { sp.remove(); if (state.onboarded) countUp(); }, 450); };
  if (seen){ sp.remove(); countUp(); return; }
  sp.addEventListener('click', hide); setTimeout(hide, 2100);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
